<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediSaathi — Personal Health &amp; Medicine Companion</title>
<meta name="description" content="MediSaathi is a private, offline-friendly companion for medicine reminders, health tracking and family health records.">
<meta name="theme-color" content="#0EA5A0">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MediSaathi">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Urdu:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   MediSaathi — Design tokens
   Palette: #0EA5A0 teal (primary/trust), #6C63FF violet (secondary),
   #FF8A5B coral (accent/attention), #2FB380 success, #E1523D danger,
   #FFB020 warning. Type: Outfit (display) + Inter (body) + Noto Sans Urdu.
   ========================================================================= */

:root {
  --accent: #0EA5A0;
  --accent-2: #6C63FF;
  --accent-3: #FF8A5B;
  --accent-soft: #E3F6F4;
  --success: #2FB380;
  --warning: #FFB020;
  --danger: #E1523D;

  --bg: #EAF3F4;
  --bg-grad:
    radial-gradient(1000px 620px at -10% -15%, rgba(14,165,160,0.28) 0%, transparent 55%),
    radial-gradient(900px 560px at 115% -5%, rgba(108,99,255,0.24) 0%, transparent 55%),
    radial-gradient(800px 500px at 100% 100%, rgba(255,138,91,0.16) 0%, transparent 50%),
    radial-gradient(900px 700px at 0% 100%, rgba(14,165,160,0.14) 0%, transparent 55%),
    linear-gradient(180deg, #F1F8F8 0%, #EAF2F4 55%, #EEF0F9 100%);
  --surface: rgba(255, 255, 255, 0.50);
  --surface-solid: rgba(255, 255, 255, 0.86);
  --surface-border: rgba(255, 255, 255, 0.65);
  --text: #0B2233;
  --text-muted: #5B7481;
  --shadow: 0 16px 40px rgba(15, 60, 60, 0.14), 0 2px 8px rgba(15,60,60,0.06);
  --shadow-sm: 0 6px 18px rgba(15, 60, 60, 0.10);
  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 14px;
  --chart-grid: rgba(91, 116, 129, 0.16);
  --ring-track: rgba(91, 116, 129, 0.14);
  --blur: 24px;
  --sheen: linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.08) 30%, rgba(255,255,255,0) 60%);

  --font-display: 'Outfit', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;

  --nav-h: 76px;
  --topbar-h: auto;
}

:root[dir="rtl"] {
  --font-display: 'Noto Sans Urdu', 'Outfit', system-ui, sans-serif;
  --font-body: 'Noto Sans Urdu', 'Inter', system-ui, sans-serif;
}

/* Noto Sans Urdu renders visually smaller and tighter than Latin faces at
   the same px size, which is what reads as "cramped / old-desktop" — so RTL
   gets slightly larger type and more generous line-height everywhere. */
:root[dir="rtl"] body { font-size: 1.04em; }
:root[dir="rtl"] p, :root[dir="rtl"] .form label, :root[dir="rtl"] .muted { line-height: 1.85; }
:root[dir="rtl"] h1, :root[dir="rtl"] h2, :root[dir="rtl"] h3 { line-height: 1.5; }
:root[dir="rtl"] .btn, :root[dir="rtl"] .nav-btn__label, :root[dir="rtl"] .status-pill,
:root[dir="rtl"] .category-pill, :root[dir="rtl"] .filter-chip { letter-spacing: 0; }

[data-theme="dark"] {
  --bg: #0A0F1A;
  --bg-grad:
    radial-gradient(1000px 620px at -10% -15%, rgba(14,165,160,0.22) 0%, transparent 55%),
    radial-gradient(900px 560px at 115% -5%, rgba(108,99,255,0.20) 0%, transparent 55%),
    radial-gradient(800px 600px at 50% 110%, rgba(255,138,91,0.10) 0%, transparent 55%),
    linear-gradient(180deg, #0A0F1A 0%, #0B1220 100%);
  --surface: rgba(255, 255, 255, 0.07);
  --surface-solid: rgba(22, 30, 46, 0.82);
  --surface-border: rgba(255, 255, 255, 0.12);
  --text: #EAF2F3;
  --text-muted: #93A6B0;
  --shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0,0,0,0.3);
  --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.35);
  --chart-grid: rgba(255, 255, 255, 0.10);
  --ring-track: rgba(255, 255, 255, 0.10);
  --sheen: linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.02) 30%, rgba(255,255,255,0) 60%);
}

[data-theme="medical"] {
  --accent: #0B7C86;
  --accent-2: #2C6EF2;
  --accent-3: #E1523D;
  --accent-soft: #E4F1F3;
  --bg: #F2F7F9;
  --bg-grad:
    radial-gradient(1000px 600px at -10% -15%, rgba(11,124,134,0.18) 0%, transparent 55%),
    radial-gradient(900px 560px at 115% -5%, rgba(44,110,242,0.16) 0%, transparent 55%),
    linear-gradient(180deg, #F5FAFB 0%, #F0F5FA 100%);
  --surface: rgba(255, 255, 255, 0.62);
  --surface-solid: rgba(255, 255, 255, 0.92);
  --surface-border: rgba(11, 124, 134, 0.16);
  --text: #0B2233;
  --text-muted: #4E6672;
  --shadow: 0 16px 36px rgba(11, 60, 70, 0.12);
}

/* =========================================================================
   Reset + base
   ========================================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; width: 100%; overflow-x: hidden; }
body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg-grad);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
  width: 100%;
  min-width: 0;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0 0 .4em; line-height: 1.2; }
p { margin: 0 0 .6em; line-height: 1.5; }
ul { list-style: none; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
button { cursor: pointer; }

.skip-link {
  position: absolute; left: -999px; top: 0; background: var(--accent); color: #fff;
  padding: .6em 1em; z-index: 999; border-radius: 0 0 8px 0;
}
.skip-link:focus { left: 0; }

:focus-visible {
  outline: 3px solid var(--accent-2);
  outline-offset: 2px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

.muted { color: var(--text-muted); }
.warning-text { color: var(--warning); font-weight: 600; }
.up { color: var(--danger); }
.down { color: var(--accent); }

/* =========================================================================
   Glass surface
   ========================================================================= */
.glass {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  backdrop-filter: blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.glass::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--sheen);
  pointer-events: none;
}
.glass > * { position: relative; z-index: 1; }

/* =========================================================================
   Layout shell
   ========================================================================= */
.topbar {
  position: sticky; top: 0; z-index: 40;
  width: 100%; box-sizing: border-box;
  padding: max(14px, env(safe-area-inset-top)) 16px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--surface-border);
}
.topbar__row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topbar__title-group { display: flex; flex-direction: column; }
.topbar__title { font-size: 1.15rem; font-weight: 700; margin: 0; line-height: 1.15; }
.topbar__brand-sub { font-size: .66rem; color: var(--text-muted); font-weight: 500; margin-top: 1px; }

.app {
  max-width: 720px;
  width: 100%;
  box-sizing: border-box;
  margin: 0 auto;
  padding: 14px 16px 32px;
  min-height: 50vh;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  width: 100%; box-sizing: border-box;
  display: flex; justify-content: space-around;
  height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface-solid); backdrop-filter: blur(var(--blur)) saturate(160%); -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
  border-top: 1px solid var(--surface-border);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 30px rgba(15,60,60,0.10);
}
.nav-btn {
  background: none; border: none; flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-muted); font-size: .72rem; padding: 6px 2px;
  transition: color .15s ease, transform .15s ease;
}
.nav-btn__icon { font-size: 1.3rem; }
.nav-btn--active { color: var(--accent); }
.nav-btn--active .nav-btn__icon { transform: translateY(-1px) scale(1.08); }
.nav-btn--active .nav-btn__icon { position: relative; }
.nav-btn--active .nav-btn__icon::after {
  content: ''; position: absolute; inset: -6px; z-index: -1; border-radius: 12px;
  background: var(--accent-soft);
}

.icon-btn {
  background: var(--surface); border: 1px solid var(--surface-border);
  width: 40px; height: 40px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 1.05rem;
}

/* Person bar */
.topbar__actions { display: flex; align-items: center; gap: 8px; }
.lang-toggle {
  display: flex; align-items: center; background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: 999px; padding: 3px; backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
}
.lang-toggle__btn {
  background: transparent; border: none; padding: .35em .7em; border-radius: 999px; font-size: .78rem; font-weight: 700; color: var(--text-muted);
}
.lang-toggle__btn--active { background: var(--accent); color: #fff; }

.person-bar { margin-top: 8px; }
.person-chip {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: 999px; padding: 6px 14px 6px 6px; width: 100%;
}
.person-chip__avatar {
  width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.person-chip__meta { display: flex; flex-direction: column; align-items: flex-start; flex: 1; }
.person-chip__label { font-size: .68rem; color: var(--text-muted); }
.person-chip__name { font-weight: 600; }
.person-chip__chevron { color: var(--text-muted); }

.person-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.person-option {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: 10px 14px; text-align: start;
}
.person-option--active { outline: 2px solid var(--accent); }
.person-option small { display: block; color: var(--text-muted); }

/* =========================================================================
   Buttons
   ========================================================================= */
.btn {
  border-radius: 999px; padding: .7em 1.3em; font-weight: 600; border: 1px solid transparent;
  transition: transform .1s ease, box-shadow .15s ease;
}
.btn:active { transform: scale(0.97); }
.btn--primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: var(--shadow-sm); }
.btn--soft { background: var(--accent-soft); color: var(--accent); }
.btn--ghost { background: transparent; border-color: var(--surface-border); color: var(--text); }
.btn--danger { background: rgba(225, 82, 61, 0.12); color: var(--danger); }
.btn--sm { padding: .4em .9em; font-size: .85rem; }
.btn--full { width: 100%; }
.file-btn { display: inline-flex; align-items: center; justify-content: center; }

.chip-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none; font-weight: 700;
}
.chip-btn--taken { background: rgba(47,179,128,0.15); color: var(--success); }
.chip-btn--missed { background: rgba(225,82,61,0.12); color: var(--danger); }

/* =========================================================================
   Hero / dashboard
   ========================================================================= */
.hero-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px; margin-bottom: 14px;
}
.hero-card__eyebrow { color: var(--text-muted); margin: 0; font-size: .85rem; }
.hero-card h1 { font-size: 1.5rem; margin: .1em 0; }
.hero-card__sub { margin: 0; color: var(--text-muted); font-size: .85rem; }
.hero-card__ring { position: relative; display: flex; align-items: center; justify-content: center; }
.ring-text {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-text strong { font-size: 1.2rem; }
.ring-text span { font-size: .68rem; color: var(--text-muted); }
.ring-progress { transition: stroke-dashoffset .6s ease; }

.quick-add-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.quick-add-row::-webkit-scrollbar { display: none; }
.quick-add-chip {
  flex: 0 0 auto; background: var(--surface-solid); backdrop-filter: blur(calc(var(--blur) * 0.55)); -webkit-backdrop-filter: blur(calc(var(--blur) * 0.55)); border: 1px solid var(--surface-border);
  border-radius: 999px; padding: .55em 1em; font-size: .85rem; box-shadow: var(--shadow-sm); white-space: nowrap;
}

.explore-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px;
}
.explore-tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 6px; text-align: center; font-size: .78rem; font-weight: 600;
}
.explore-tile span { font-size: 1.4rem; }

.dashboard-footer-credit {
  text-align: center; color: var(--text-muted); font-size: .78rem;
  margin: 18px 0 6px; opacity: .85;
}

.card-section { margin-bottom: 20px; }
.card-section h2 { font-size: 1.05rem; }

.empty-inline { text-align: center; padding: 18px 10px; }
.empty-state { text-align: center; padding: 48px 16px; }
.empty-state__icon { font-size: 2.6rem; margin-bottom: 8px; }
.empty-state h2 { font-size: 1.1rem; }
.empty-state p { color: var(--text-muted); max-width: 340px; margin-inline: auto; }

/* Dose list */
.dose-list { display: flex; flex-direction: column; gap: 8px; }
.dose-row {
  display: grid; grid-template-columns: 52px 40px 1fr auto auto; align-items: center; gap: 10px;
  background: var(--surface-solid); backdrop-filter: blur(calc(var(--blur) * 0.55)); -webkit-backdrop-filter: blur(calc(var(--blur) * 0.55)); border: 1px solid var(--surface-border); border-radius: var(--radius-md);
  padding: 10px 12px; box-shadow: var(--shadow-sm);
}
.dose-row--taken { opacity: .75; }
.dose-row__time { font-weight: 700; font-size: .82rem; color: var(--text-muted); }
.dose-row__avatar { width: 34px; height: 34px; border-radius: 10px; overflow: hidden; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }
.dose-row__avatar img { width: 100%; height: 100%; object-fit: cover; }
.dose-row__info { display: flex; flex-direction: column; min-width: 0; }
.dose-row__info strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dose-row__info small { color: var(--text-muted); }
.dose-row__actions { display: flex; gap: 6px; }

.reading-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.reading-card {
  background: var(--surface-solid); backdrop-filter: blur(calc(var(--blur) * 0.55)); -webkit-backdrop-filter: blur(calc(var(--blur) * 0.55)); border: 1px solid var(--surface-border); border-radius: var(--radius-md);
  padding: 12px 14px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 2px;
}
.reading-card__label { font-size: .75rem; color: var(--text-muted); }
.reading-card__value { font-size: 1.3rem; font-weight: 700; font-family: var(--font-display); }
.reading-card__unit { font-size: .72rem; color: var(--text-muted); }

.note-list { display: flex; flex-direction: column; gap: 8px; }
.note-item { background: var(--surface-solid); backdrop-filter: blur(calc(var(--blur) * 0.55)); -webkit-backdrop-filter: blur(calc(var(--blur) * 0.55)); border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: 10px 12px; }
.note-item p { margin: 2px 0 0; color: var(--text-muted); font-size: .88rem; }

.install-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; margin-top: 8px; }
.install-banner p { margin: 0; color: var(--text-muted); font-size: .85rem; }

/* =========================================================================
   View header
   ========================================================================= */
.view-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.view-header h1 { font-size: 1.3rem; }

/* =========================================================================
   Medicines
   ========================================================================= */
.med-card-list { display: flex; flex-direction: column; gap: 12px; }
.med-card { display: flex; gap: 12px; padding: 14px; }
.med-card__photo {
  width: 56px; height: 56px; border-radius: 14px; overflow: hidden; flex-shrink: 0;
  background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
}
.med-card__photo img { width: 100%; height: 100%; object-fit: cover; }
.med-card__body { flex: 1; min-width: 0; }
.med-card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.med-card__actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

.status-pill {
  font-size: .68rem; font-weight: 700; padding: .25em .7em; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); text-transform: capitalize;
}
.status-pill--paused { background: rgba(255,176,32,0.16); color: #B5780A; }
.status-pill--completed { background: rgba(91,116,129,0.16); color: var(--text-muted); }

.category-pill {
  font-size: .68rem; font-weight: 600; padding: .25em .7em; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); display: inline-block;
}

/* =========================================================================
   Vitals
   ========================================================================= */
.vitals-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.vitals-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 10px; text-align: center; font-weight: 700; }
.vitals-tile__icon { font-size: 1.8rem; }

.info-banner { background: var(--accent-soft); color: var(--accent); padding: 10px 14px; border-radius: var(--radius-sm); font-size: .85rem; }

.chart-card { padding: 12px 8px 6px; margin: 12px 0; }
.chart-empty { text-align: center; color: var(--text-muted); padding: 24px 0; }
.chart-axis-label { font-size: 9px; fill: var(--text-muted); font-family: var(--font-body); }
.chart-legend { display: flex; gap: 14px; justify-content: center; padding: 6px 0 2px; }
.chart-legend-item { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--text-muted); }
.chart-legend-item i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.stats-row { display: flex; gap: 8px; margin-bottom: 12px; }
.stat-pill { flex: 1; background: var(--surface-solid); backdrop-filter: blur(calc(var(--blur) * 0.55)); -webkit-backdrop-filter: blur(calc(var(--blur) * 0.55)); border: 1px solid var(--surface-border); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
.stat-pill span { display: block; font-size: .7rem; color: var(--text-muted); }
.stat-pill strong { font-family: var(--font-display); }

.reading-list, .reading-row { }
.reading-row {
  display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius-md); margin-bottom: 8px;
}
.reading-row > div { flex: 1; min-width: 0; }
.reading-row__img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }

/* =========================================================================
   Notes / Vault
   ========================================================================= */
.note-card-list { display: flex; flex-direction: column; gap: 10px; }
.note-card { padding: 14px; }
.note-card__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }

.vault-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.vault-card { padding: 10px; position: relative; }
.vault-card__preview {
  aspect-ratio: 4/3; border-radius: var(--radius-sm); overflow: hidden; background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 8px;
}
.vault-card__preview img { width: 100%; height: 100%; object-fit: cover; }
.vault-card button.icon-btn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; background: rgba(255,255,255,0.85); }
:root[dir="rtl"] .vault-card button.icon-btn { right: auto; left: 8px; }

/* =========================================================================
   Timeline / calendar
   ========================================================================= */
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  flex: 0 0 auto; border: 1px solid var(--surface-border); background: var(--surface-solid); backdrop-filter: blur(calc(var(--blur) * 0.55)); -webkit-backdrop-filter: blur(calc(var(--blur) * 0.55));
  border-radius: 999px; padding: .45em 1em; font-size: .82rem; white-space: nowrap;
}

// ==== db.js ====
// db.js — tiny promise-based IndexedDB wrapper for MediSaathi.
// No external dependencies, so the app keeps working fully offline.

const DB_NAME = 'medisaathi-db';
const DB_VERSION = 2;

const STORES = [
  { name: 'persons', keyPath: 'id' },
  { name: 'medicines', keyPath: 'id' },
  { name: 'doseLogs', keyPath: 'id' },
  { name: 'vitalsBP', keyPath: 'id' },
  { name: 'vitalsSugar', keyPath: 'id' },
  { name: 'vitalsWeight', keyPath: 'id' },
  { name: 'vitalsOther', keyPath: 'id' },
  { name: 'notes', keyPath: 'id' },
  { name: 'vault', keyPath: 'id' },
  { name: 'activity', keyPath: 'id' },
  { name: 'water', keyPath: 'id' },
  { name: 'sleep', keyPath: 'id' },
  { name: 'customEntries', keyPath: 'id' },
  { name: 'feelings', keyPath: 'id' },
  { name: 'doctorQuestions', keyPath: 'id' },
  { name: 'emergencyCards', keyPath: 'id' },
  { name: 'settings', keyPath: 'key' }
];

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) {
      reject(new Error('IndexedDB is not supported in this browser.'));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      STORES.forEach((s) => {
        if (!db.objectStoreNames.contains(s.name)) {
          db.createObjectStore(s.name, { keyPath: s.keyPath });
        }
      });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function uid() {
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
}

async function tx(storeName, mode = 'readonly') {
  const db = await openDB();
  const transaction = db.transaction(storeName, mode);
  return transaction.objectStore(storeName);
}

async function getAll(storeName) {
  try {
    const store = await tx(storeName);
    return await new Promise((resolve, reject) => {
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    console.error('getAll failed for', storeName, err);
    return [];
  }
}

async function get(storeName, key) {
  try {
    const store = await tx(storeName);
    return await new Promise((resolve, reject) => {
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    console.error('get failed for', storeName, err);
    return null;
  }
}

async function put(storeName, value) {
  const store = await tx(storeName, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = store.put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}

async function remove(storeName, key) {
  const store = await tx(storeName, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = store.delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

async function clearStore(storeName) {
  const store = await tx(storeName, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = store.clear();
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

async function clearAllData() {
  for (const s of STORES) {
    await clearStore(s.name);
  }
}

async function exportAllData() {
  const data = {};
  for (const s of STORES) {
    data[s.name] = await getAll(s.name);
  }
  data.__meta = { app: 'MediSaathi', exportedAt: new Date().toISOString(), version: DB_VERSION };
  return data;
}

async function importAllData(data) {
  if (!data || typeof data !== 'object') throw new Error('Invalid backup file.');
  for (const s of STORES) {
    if (Array.isArray(data[s.name])) {
      await clearStore(s.name);
      const store = await tx(s.name, 'readwrite');
      for (const item of data[s.name]) {
        store.put(item);
      }
    }
  }
  return true;
}

async function getSetting(key, fallback = null) {
  const row = await get('settings', key);
  return row ? row.value : fallback;
}

async function setSetting(key, value) {
  return put('settings', { key, value });
}

const DB = {
  uid,
  getAll,
  get,
  put,
  remove,
  clearStore,
  clearAllData,
  exportAllData,
  importAllData,
  getSetting,
  setSetting
};

let currentLang = 'en';

function setLang(lang) {
  currentLang = STRINGS[lang] ? lang : 'en';
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ur' ? 'rtl' : 'ltr';
}

function getLang() {
  return currentLang;
}

function t(key) {
  const dict = STRINGS[currentLang] || STRINGS.en;
  return (key in dict) ? dict[key] : (STRINGS.en[key] || key);
}

// ==== utils.js ====
// utils.js — small shared helpers used across the app.

function pad2(n) {
  return String(n).padStart(2, '0');
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function nowTimeHM() {
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function isoFromDate(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDateHuman(iso, lang, monthNames) {
  if (!iso) return '';
  const d = parseISO(iso);
  const month = monthNames[d.getMonth()];
  return lang === 'ur' ? `${d.getDate()} ${month} ${d.getFullYear()}` : `${month} ${d.getDate()}, ${d.getFullYear()}`;
}

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return isoFromDate(d);
}

function addDays(iso, n) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + n);
  return isoFromDate(d);
}

function diffDays(isoA, isoB) {
  const a = parseISO(isoA);
  const b = parseISO(isoB);
  return Math.round((a - b) / 86400000);
}

function timeToMinutes(hm) {
  if (!hm) return 0;
  const [h, m] = hm.split(':').map(Number);
  return h * 60 + m;
}

function fileToDataURL(file, maxDim = 1280, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file) { resolve(null); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      // Downscale images so IndexedDB doesn't balloon in size.
      if (!file.type.startsWith('image/')) {
        resolve({ dataURL: reader.result, type: file.type, isImage: false, name: file.name });
        return;
      }
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataURL = canvas.toDataURL('image/jpeg', quality);
        resolve({ dataURL, type: 'image/jpeg', isImage: true, name: file.name });
      };
      img.onerror = () => resolve({ dataURL: reader.result, type: file.type, isImage: false, name: file.name });
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function average(nums) {
  if (!nums.length) return null;
  return nums.reduce((a, b) => a + b, 0) / nums.length;
}

function round1(n) {
  return Math.round(n * 10) / 10;
}

let toastTimer = null;
function showToast(message) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.add('toast--visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('toast--visible'), 2600);
}

function confirmDialog(message) {
  // Wraps window.confirm so behaviour is easy to swap out later if desired.
  return window.confirm(message);
}

function debounce(fn, wait = 200) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

const U = { pad2, todayISO, nowTimeHM, isoFromDate, parseISO, formatDateHuman, daysAgo, addDays, diffDays, timeToMinutes, fileToDataURL, escapeHTML, average, round1, showToast, confirmDialog, debounce };

// ==== charts.js ====
// charts.js — minimal, dependency-free SVG chart renderer.
// Kept intentionally small: no CDN chart library is loaded, so charts
// keep working even fully offline on GitHub Pages.

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

/**
 * Renders a simple line chart into `container`.
 * series: [{ label, values: [{x:number index, y:number, dateLabel:string}], color }]
 */
function renderLineChart(container, { series, yLabelFormatter, emptyText, height = 180 }) {
  container.innerHTML = '';
  const allPoints = series.flatMap((s) => s.values);
  if (!allPoints.length) {
    container.innerHTML = `<p class="chart-empty">${emptyText}</p>`;
    return;
  }
  const width = Math.max(container.clientWidth || 320, 280);
  const padding = { top: 16, right: 16, bottom: 28, left: 40 };
  const ys = allPoints.map((p) => p.y);
  let min = Math.min(...ys);
  let max = Math.max(...ys);
  if (min === max) { min -= 1; max += 1; }
  const range = max - min;
  min -= range * 0.1;
  max += range * 0.1;

  const xCount = Math.max(...series.map((s) => s.values.length), 2);
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, width: '100%', height, role: 'img', 'aria-label': 'trend chart' });

  // Gridlines + y labels
  const gridCount = 4;
  for (let i = 0; i <= gridCount; i++) {
    const yVal = min + ((max - min) * i) / gridCount;
    const yPos = padding.top + innerH - (innerH * i) / gridCount;
    const line = svgEl('line', {
      x1: padding.left, x2: width - padding.right, y1: yPos, y2: yPos,
      stroke: 'var(--chart-grid, rgba(120,140,150,0.18))', 'stroke-width': 1
    });
    svg.appendChild(line);
    const label = svgEl('text', {
      x: padding.left - 8, y: yPos + 4, 'text-anchor': 'end',
      class: 'chart-axis-label'
    });
    label.textContent = yLabelFormatter ? yLabelFormatter(yVal) : Math.round(yVal);
    svg.appendChild(label);
  }

  series.forEach((s) => {
    if (!s.values.length) return;
    const points = s.values.map((p, i) => {
      const x = padding.left + (s.values.length > 1 ? (innerW * i) / (s.values.length - 1) : innerW / 2);
      const y = padding.top + innerH - ((p.y - min) / (max - min)) * innerH;
      return { x, y, ...p };
    });
    const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const path = svgEl('path', { d: pathD, fill: 'none', stroke: s.color || 'var(--accent)', 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    svg.appendChild(path);

    points.forEach((p) => {
      const dot = svgEl('circle', { cx: p.x, cy: p.y, r: 3.5, fill: s.color || 'var(--accent)' });
      const title = svgEl('title', {});
      title.textContent = `${p.dateLabel || ''}: ${p.y}`;
      dot.appendChild(title);
      svg.appendChild(dot);
    });

    // x-axis labels (first, middle, last only, to avoid clutter)
    const labelIdxs = new Set([0, points.length - 1, Math.floor(points.length / 2)]);
    labelIdxs.forEach((idx) => {
      const p = points[idx];
      if (!p) return;
      const label = svgEl('text', { x: p.x, y: height - 6, 'text-anchor': 'middle', class: 'chart-axis-label' });
      label.textContent = p.dateLabel || '';
      svg.appendChild(label);
    });
  });

  container.appendChild(svg);

  if (series.length > 1) {
    const legend = document.createElement('div');
    legend.className = 'chart-legend';
    series.forEach((s) => {
      const item = document.createElement('span');
      item.className = 'chart-legend-item';
      item.innerHTML = `<i style="background:${s.color || 'var(--accent)'}"></i>${s.label}`;
      legend.appendChild(item);
    });
    container.appendChild(legend);
  }
}

/**
 * Renders a simple vertical bar chart.
 * bars: [{ label, value, color }]
 */
function renderBarChart(container, { bars, emptyText, height = 160, valueFormatter }) {
  container.innerHTML = '';
  if (!bars.length || bars.every((b) => !b.value)) {
    container.innerHTML = `<p class="chart-empty">${emptyText}</p>`;
    return;
  }
  const width = Math.max(container.clientWidth || 320, 280);
  const padding = { top: 16, right: 12, bottom: 28, left: 12 };
  const max = Math.max(...bars.map((b) => b.value), 1);
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const barGap = 10;
  const barW = Math.max((innerW - barGap * (bars.length - 1)) / bars.length, 8);

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, width: '100%', height, role: 'img', 'aria-label': 'bar chart' });

  bars.forEach((b, i) => {
    const barH = (b.value / max) * innerH;
    const x = padding.left + i * (barW + barGap);
    const y = padding.top + innerH - barH;
    const rect = svgEl('rect', { x, y, width: barW, height: Math.max(barH, 2), rx: 6, fill: b.color || 'var(--accent)' });
    const title = svgEl('title', {});
    title.textContent = `${b.label}: ${valueFormatter ? valueFormatter(b.value) : b.value}`;
    rect.appendChild(title);
    svg.appendChild(rect);

    const label = svgEl('text', { x: x + barW / 2, y: height - 6, 'text-anchor': 'middle', class: 'chart-axis-label' });
    label.textContent = b.label;
    svg.appendChild(label);
  });

  container.appendChild(svg);
}

/**
 * Renders a compact circular progress ring (used for today's adherence).
 */
function renderProgressRing(container, { percent, label, sublabel }) {
  container.innerHTML = '';
  const size = 108;
  const stroke = 10;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (Math.min(Math.max(percent, 0), 100) / 100) * c;

  const svg = svgEl('svg', { viewBox: `0 0 ${size} ${size}`, width: size, height: size, role: 'img', 'aria-label': label });
  const bg = svgEl('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: 'var(--ring-track, rgba(120,140,150,0.18))', 'stroke-width': stroke });
  const fg = svgEl('circle', {
    cx: size / 2, cy: size / 2, r, fill: 'none', stroke: 'var(--accent)', 'stroke-width': stroke,
    'stroke-linecap': 'round', 'stroke-dasharray': c, 'stroke-dashoffset': offset,
    transform: `rotate(-90 ${size / 2} ${size / 2})`
  });
  fg.classList.add('ring-progress');
  svg.appendChild(bg);
  svg.appendChild(fg);
  container.appendChild(svg);

  const textWrap = document.createElement('div');
  textWrap.className = 'ring-text';
  textWrap.innerHTML = `<strong>${Math.round(percent)}%</strong><span>${sublabel || ''}</span>`;
  container.appendChild(textWrap);
}

const state = {
  personId: null,
  persons: [],
  theme: 'light',
  lang: 'en',
  trackers: { heartrate: true, spo2: true, temperature: false, sleep: false, steps: false },
  dashboardSections: {
    todayMeds: true, upcoming: true, readings: true, notes: true, monthly: true, activity: true
  },
  deferredInstallPrompt: null,
  notificationsEnabled: false,
  waterTarget: 2000,
  activeWalk: null // { status: 'running'|'paused', startTs, elapsedMs }
};

const app = document.getElementById('app');
const navEl = document.getElementById('bottom-nav');
const personBar = document.getElementById('person-bar');
const topbarTitle = document.getElementById('topbar-title');

// ---------------------------------------------------------------------------
// Boot sequence
// ---------------------------------------------------------------------------
async function boot() {
  registerServiceWorker();
  await loadSettings();
  await ensurePersonExists();
  wireGlobalUI();
  window.addEventListener('hashchange', route);
  const seenIntro = await DB.getSetting('hasSeenIntro', false);
  if (!seenIntro) {
    showIntro();
  } else {
    route();
  }
  setInterval(checkDueReminders, 60 * 1000);
}

function showIntro() {
  const overlay = document.createElement('div');
  overlay.className = 'intro-overlay';
  overlay.id = 'intro-overlay';
  overlay.innerHTML = `
    <div class="intro-overlay__logo">🩺</div>
    <h1>${t('appName')}</h1>
    <p>${t('tagline')}<br>${t('intro_tagline2')}</p>
    <p class="intro-overlay__dev">${t('about_developer_name')}</p>
    <button class="btn btn--primary" id="intro-continue">${t('intro_get_started')}</button>
  `;
  document.body.appendChild(overlay);
  document.getElementById('intro-continue').addEventListener('click', async () => {
    await DB.setSetting('hasSeenIntro', true);
    overlay.remove();
    route();
  });
}

async function loadSettings() {
  const lang = await DB.getSetting('lang', 'en');
  const theme = await DB.getSetting('theme', 'light');
  const trackers = await DB.getSetting('trackers', state.trackers);
  const dashboardSections = await DB.getSetting('dashboardSections', state.dashboardSections);
  const notificationsEnabled = await DB.getSetting('notificationsEnabled', false);
  const waterTarget = await DB.getSetting('waterTarget', 2000);
  state.lang = lang;
  state.theme = theme;
  state.trackers = trackers;
  state.dashboardSections = dashboardSections;
  state.notificationsEnabled = notificationsEnabled;
  state.waterTarget = waterTarget;
  setLang(lang);
  applyTheme(theme);
}

async function ensurePersonExists() {
  state.persons = await DB.getAll('persons');
  if (!state.persons.length) {
    const me = { id: DB.uid(), name: t('person_me'), relation: 'self', colorTag: '#0EA5A0', createdAt: Date.now() };
    await DB.put('persons', me);
    state.persons = [me];
  }
  const savedPersonId = await DB.getSetting('activePersonId', null);
  state.personId = (savedPersonId && state.persons.find((p) => p.id === savedPersonId)) ? savedPersonId : state.persons[0].id;
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}

// Forces Chromium/WebView to fully recompute layout & repaint after a live
// dir="rtl"/"ltr" change, working around a real compositor bug where
// backdrop-filter layers and logical-property offsets (border-inline-*,
// inset-inline-*) can freeze at their pre-toggle position on some Android
// Chrome/WebView builds, producing a squashed/blank layout until reload.
function forceRepaint() {
  const el = document.body;
  el.style.display = 'none';
  // eslint-disable-next-line no-unused-expressions
  void el.offsetHeight;
  el.style.display = '';
}

function currentPerson() {
  return state.persons.find((p) => p.id === state.personId) || state.persons[0];
}

// ---------------------------------------------------------------------------
// Router
// ---------------------------------------------------------------------------
const ROUTES = {
  '': renderDashboard,
  '#/dashboard': renderDashboard,
  '#/medicines': renderMedicines,
  '#/vitals': renderVitalsHub,
  '#/vitals/bp': (q) => renderVitalDetail('bp', q),
  '#/vitals/sugar': (q) => renderVitalDetail('sugar', q),
  '#/vitals/weight': (q) => renderVitalDetail('weight', q),
  '#/vitals/other': (q) => renderVitalDetail('other', q),
  '#/timeline': renderTimeline,
  '#/calendar': renderCalendar,
  '#/notes': renderNotes,
  '#/vault': renderVault,
  '#/reports': renderReports,
  '#/insights': renderInsights,
  '#/search': renderSearch,
  '#/settings': renderSettings,
  '#/about': renderAbout,
  '#/activity': renderActivity,
  '#/water': renderWater,
  '#/sleep': renderSleep,
  '#/trackers': renderTrackers,
  '#/doctor-questions': renderDoctorQuestions,
  '#/doctor-visit': renderDoctorVisit,
  '#/emergency-card': renderEmergencyCard,
  '#/food-guide': renderFoodGuide
};

function route() {
  const [path] = window.location.hash.split('?');
  const handler = ROUTES[path] || ROUTES[window.location.hash] || renderDashboard;
  document.querySelectorAll('.nav-btn').forEach((b) => {
    b.classList.toggle('nav-btn--active', b.dataset.route === (path || '#/dashboard'));
    b.setAttribute('aria-current', b.dataset.route === (path || '#/dashboard') ? 'page' : 'false');
  });
  app.setAttribute('aria-busy', 'true');
  try {
    handler(window.location.hash);
  } catch (err) {
    console.error(err);
    app.innerHTML = errorState();
  }
  app.setAttribute('aria-busy', 'false');
  app.scrollTop = 0;
  window.scrollTo(0, 0);
}

function go(hash) {
  window.location.hash = hash;
}

function errorState() {
  return `<div class="empty-state">
    <div class="empty-state__icon">⚠️</div>
    <h2>${t('common_error_generic')}</h2>
    <button class="btn btn--primary" onclick="location.hash='#/dashboard'">${t('nav_dashboard')}</button>
  </div>`;
}

// ---------------------------------------------------------------------------
// Chrome: top bar, person switcher, bottom nav
// ---------------------------------------------------------------------------
function wireGlobalUI() {
  renderPersonBar();
  renderBottomNav();
  renderTopbarLangToggle();
  document.getElementById('search-trigger').addEventListener('click', () => go('#/search'));

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    state.deferredInstallPrompt = e;
    const btn = document.getElementById('install-btn');
    if (btn) btn.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    state.deferredInstallPrompt = null;
    U.showToast(t('common_saved'));
  });
}

async function switchLanguage(lang) {
  if (state.lang === lang) return;
  state.lang = lang;
  setLang(lang);
  await DB.setSetting('lang', lang);
  forceRepaint();
  renderPersonBar();
  renderBottomNav();
  renderTopbarLangToggle();
  route();
}

function renderTopbarLangToggle() {
  const el = document.getElementById('topbar-lang-toggle');
  if (!el) return;
  el.querySelectorAll('.lang-toggle__btn').forEach((btn) => {
    btn.classList.toggle('lang-toggle__btn--active', btn.dataset.lang === state.lang);
    btn.onclick = () => switchLanguage(btn.dataset.lang);
  });
  const sub = document.getElementById('topbar-brand-sub');
  if (sub) sub.textContent = t('about_developer_name');
}

function renderBottomNav() {
  const items = [

function openPersonSwitcher() {
  const options = state.persons.map((p) => `
    <button class="person-option ${p.id === state.personId ? 'person-option--active' : ''}" data-id="${p.id}">
      <span class="person-chip__avatar" style="background:${p.colorTag || '#0EA5A0'}">${(p.name || '?').charAt(0).toUpperCase()}</span>

  openModal({
    title: t('person_switch'),
    bodyHTML: `<div class="person-list">${options}</div>

    onOpen: (modal) => {
      modal.querySelectorAll('.person-option').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.personId = btn.dataset.id;

function openAddPersonForm() {
  openModal({
    title: t('person_add'),
    bodyHTML: `
      <form id="person-form" class="form">
        <label>${t('person_name')}<input required name="name" type="text" autocomplete="off"></label>
        <label>${t('person_relation')}<input name="relation" type="text" placeholder="${t('person_relation_placeholder')}"></label>
        <div class="form-actions">
          <button type="button" class="btn btn--ghost" id="cancel-person">${t('common_cancel')}</button>
          <button type="submit" class="btn btn--primary">${t('common_save')}</button>
        </div>
      </form>`,
    onOpen: (modal) => {
      modal.querySelector('#cancel-person').addEventListener('click', closeModal);
      modal.querySelector('#person-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const colors = ['#0EA5A0', '#6C63FF', '#FF8A5B', '#3D8BFD', '#E9578C', '#2FB380'];
        const person = {
          id: DB.uid(),
          name: fd.get('name').trim() || t('person_me'),
          relation: fd.get('relation').trim(),
          colorTag: colors[state.persons.length % colors.length],
          createdAt: Date.now()
        };
        await DB.put('persons', person);
        state.persons.push(person);
        state.personId = person.id;
        await DB.setSetting('activePersonId', person.id);
        closeModal();
        renderPersonBar();
        U.showToast(t('common_saved'));
        route();
      });
    }
  });
}

// ---------------------------------------------------------------------------

const modalRoot = document.getElementById('modal-root');

function openModal({ title, bodyHTML, onOpen, wide }) {
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal ${wide ? 'modal--wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal__header">
          <h2 id="modal-title">${title}</h2>
          <button class="icon-btn" id="modal-close" aria-label="${t('common_close')}">✕</button>
        </div>
        <div class="modal__body">${bodyHTML}</div>
      </div>
    </div>`;
  const backdrop = document.getElementById('modal-backdrop');
  const modal = backdrop.querySelector('.modal');
  document.getElementById('modal-close').addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', escCloseOnce);
  if (onOpen) onOpen(modal);
  const firstInput = modal.querySelector('input, textarea, select, button');
  if (firstInput) firstInput.focus();
}

function escCloseOnce(e) {
  if (e.key === 'Escape') closeModal();
}

function closeModal() {
  modalRoot.innerHTML = '';
  document.removeEventListener('keydown', escCloseOnce);
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediSaathi — Personal Health &amp; Medicine Companion</title>
<meta name="description" content="MediSaathi is a private, offline-friendly companion for medicine reminders, health tracking and family health records.">
<meta name="theme-color" content="#0EA5A0">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MediSaathi">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Urdu:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   MediSaathi — Design tokens
   Palette: #0EA5A0 teal (primary/trust), #6C63FF violet (secondary),
   #FF8A5B coral (accent/attention), #2FB380 success, #E1523D danger,
   #FFB020 warning. Type: Outfit (display) + Inter (body) + Noto Sans Urdu.
   ========================================================================= */

:root {
  --accent: #0EA5A0;
  --accent-2: #6C63FF;
  --accent-soft: #E3F6F4;
  --success: #2FB380;
  --warning: #FFB020;
  --danger: #E1523D;

  --bg: #EEF6F5;
  --bg-grad: radial-gradient(1200px 600px at 10% -10%, #DFF3F0 0%, transparent 60%),
             radial-gradient(1000px 500px at 110% 10%, #EDE9FF 0%, transparent 55%),
             #F3F8F7;
  --surface: rgba(255, 255, 255, 0.62);
  --surface-solid: #FFFFFF;
  --surface-border: rgba(255, 255, 255, 0.55);
  --text: #0B2233;
  --text-muted: #5B7481;
  --shadow: 0 10px 30px rgba(15, 60, 60, 0.10);
  --shadow-sm: 0 4px 14px rgba(15, 60, 60, 0.08);
  --radius-lg: 26px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --chart-grid: rgba(91, 116, 129, 0.16);
  --ring-track: rgba(91, 116, 129, 0.14);
  --blur: 18px;

  --font-display: 'Outfit', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;

  --nav-h: 74px;
  --topbar-h: auto;
}

:root[dir="rtl"] {
  --font-display: 'Noto Sans Urdu', 'Outfit', system-ui, sans-serif;
  --font-body: 'Noto Sans Urdu', 'Inter', system-ui, sans-serif;
}

[data-theme="dark"] {
  --bg: #0B1220;
  --bg-grad: radial-gradient(1200px 600px at 10% -10%, rgba(14,165,160,0.16) 0%, transparent 60%),
             radial-gradient(1000px 500px at 110% 10%, rgba(108,99,255,0.14) 0%, transparent 55%),
             #0B1220;
  --surface: rgba(255, 255, 255, 0.06);
  --surface-solid: #111a2b;
  --surface-border: rgba(255, 255, 255, 0.10);
  --text: #EAF2F3;
  --text-muted: #93A6B0;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.3);
  --chart-grid: rgba(255, 255, 255, 0.10);
  --ring-track: rgba(255, 255, 255, 0.10);
}

[data-theme="medical"] {
  --accent: #0B7C86;
  --accent-2: #2C6EF2;
  --accent-soft: #E4F1F3;
  --bg: #F4F8FA;
  --bg-grad: radial-gradient(1100px 550px at 8% -10%, #E1F1F4 0%, transparent 55%),
             radial-gradient(900px 500px at 105% 5%, #E7EEFC 0%, transparent 55%),
             #F6FAFB;
  --surface: rgba(255, 255, 255, 0.72);
  --surface-solid: #FFFFFF;
  --surface-border: rgba(11, 124, 134, 0.14);
  --text: #0B2233;
  --text-muted: #4E6672;
  --shadow: 0 10px 26px rgba(11, 60, 70, 0.10);
}

/* =========================================================================
   Reset + base
   ========================================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; width: 100%; overflow-x: hidden; }
body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg-grad);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
  width: 100%;
  min-width: 0;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0 0 .4em; line-height: 1.2; }
p { margin: 0 0 .6em; line-height: 1.5; }
ul { list-style: none; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
button { cursor: pointer; }

.skip-link {
  position: absolute; left: -999px; top: 0; background: var(--accent); color: #fff;
  padding: .6em 1em; z-index: 999; border-radius: 0 0 8px 0;
}
.skip-link:focus { left: 0; }

:focus-visible {
  outline: 3px solid var(--accent-2);
  outline-offset: 2px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

.muted { color: var(--text-muted); }
.warning-text { color: var(--warning); font-weight: 600; }
.up { color: var(--danger); }
.down { color: var(--accent); }

/* =========================================================================
   Glass surface
   ========================================================================= */
.glass {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}

/* =========================================================================
   Layout shell
   ========================================================================= */
.topbar {
  position: sticky; top: 0; z-index: 40;
  width: 100%; box-sizing: border-box;
  padding: max(14px, env(safe-area-inset-top)) 16px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--surface-border);
}
.topbar__row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topbar__title { font-size: 1.15rem; font-weight: 700; margin: 0; }

.app {
  max-width: 720px;
  width: 100%;
  box-sizing: border-box;
  margin: 0 auto;
  padding: 14px 16px 32px;
  min-height: 50vh;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  width: 100%; box-sizing: border-box;
  display: flex; justify-content: space-around;
  height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface-solid);
  border-top: 1px solid var(--surface-border);
  box-shadow: 0 -6px 20px rgba(0,0,0,0.05);
}
.nav-btn {
  background: none; border: none; flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-muted); font-size: .72rem; padding: 6px 2px;
  transition: color .15s ease, transform .15s ease;
}
.nav-btn__icon { font-size: 1.3rem; }
.nav-btn--active { color: var(--accent); }
.nav-btn--active .nav-btn__icon { transform: translateY(-1px) scale(1.08); }

.icon-btn {
  background: var(--surface); border: 1px solid var(--surface-border);
  width: 40px; height: 40px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 1.05rem;
}

/* Person bar */
.person-bar { margin-top: 8px; }
.person-chip {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: 999px; padding: 6px 14px 6px 6px; width: 100%;
}
.person-chip__avatar {
  width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.person-chip__meta { display: flex; flex-direction: column; align-items: flex-start; flex: 1; }
.person-chip__label { font-size: .68rem; color: var(--text-muted); }
.person-chip__name { font-weight: 600; }
.person-chip__chevron { color: var(--text-muted); }

.person-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.person-option {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: 10px 14px; text-align: start;
}
.person-option--active { outline: 2px solid var(--accent); }
.person-option small { display: block; color: var(--text-muted); }

/* =========================================================================
   Buttons
   ========================================================================= */
.btn {
  border-radius: 999px; padding: .7em 1.3em; font-weight: 600; border: 1px solid transparent;
  transition: transform .1s ease, box-shadow .15s ease;
}
.btn:active { transform: scale(0.97); }
.btn--primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: var(--shadow-sm); }
.btn--soft { background: var(--accent-soft); color: var(--accent); }
.btn--ghost { background: transparent; border-color: var(--surface-border); color: var(--text); }
.btn--danger { background: rgba(225, 82, 61, 0.12); color: var(--danger); }
.btn--sm { padding: .4em .9em; font-size: .85rem; }
.btn--full { width: 100%; }
.file-btn { display: inline-flex; align-items: center; justify-content: center; }

.chip-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none; font-weight: 700;
}
.chip-btn--taken { background: rgba(47,179,128,0.15); color: var(--success); }
.chip-btn--missed { background: rgba(225,82,61,0.12); color: var(--danger); }

/* =========================================================================
   Hero / dashboard
   ========================================================================= */
.hero-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px; margin-bottom: 14px;
}
.hero-card__eyebrow { color: var(--text-muted); margin: 0; font-size: .85rem; }
.hero-card h1 { font-size: 1.5rem; margin: .1em 0; }
.hero-card__sub { margin: 0; color: var(--text-muted); font-size: .85rem; }
.hero-card__ring { position: relative; display: flex; align-items: center; justify-content: center; }
.ring-text {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-text strong { font-size: 1.2rem; }
.ring-text span { font-size: .68rem; color: var(--text-muted); }
.ring-progress { transition: stroke-dashoffset .6s ease; }

.quick-add-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.quick-add-row::-webkit-scrollbar { display: none; }
.quick-add-chip {
  flex: 0 0 auto; background: var(--surface-solid); border: 1px solid var(--surface-border);
  border-radius: 999px; padding: .55em 1em; font-size: .85rem; box-shadow: var(--shadow-sm); white-space: nowrap;
}

.explore-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px;
}
.explore-tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 6px; text-align: center; font-size: .78rem; font-weight: 600;
}
.explore-tile span { font-size: 1.4rem; }

.card-section { margin-bottom: 20px; }
.card-section h2 { font-size: 1.05rem; }

.empty-inline { text-align: center; padding: 18px 10px; }
.empty-state { text-align: center; padding: 48px 16px; }
.empty-state__icon { font-size: 2.6rem; margin-bottom: 8px; }
.empty-state h2 { font-size: 1.1rem; }
.empty-state p { color: var(--text-muted); max-width: 340px; margin-inline: auto; }

/* Dose list */
.dose-list { display: flex; flex-direction: column; gap: 8px; }
.dose-row {
  display: grid; grid-template-columns: 52px 40px 1fr auto auto; align-items: center; gap: 10px;
  background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: var(--radius-md);
  padding: 10px 12px; box-shadow: var(--shadow-sm);
}
.dose-row--taken { opacity: .75; }
.dose-row__time { font-weight: 700; font-size: .82rem; color: var(--text-muted); }
.dose-row__avatar { width: 34px; height: 34px; border-radius: 10px; overflow: hidden; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }
.dose-row__avatar img { width: 100%; height: 100%; object-fit: cover; }
.dose-row__info { display: flex; flex-direction: column; min-width: 0; }
.dose-row__info strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dose-row__info small { color: var(--text-muted); }
.dose-row__actions { display: flex; gap: 6px; }

.reading-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.reading-card {
  background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: var(--radius-md);
  padding: 12px 14px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 2px;
}
.reading-card__label { font-size: .75rem; color: var(--text-muted); }
.reading-card__value { font-size: 1.3rem; font-weight: 700; font-family: var(--font-display); }
.reading-card__unit { font-size: .72rem; color: var(--text-muted); }

.note-list { display: flex; flex-direction: column; gap: 8px; }
.note-item { background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: 10px 12px; }
.note-item p { margin: 2px 0 0; color: var(--text-muted); font-size: .88rem; }

.install-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; margin-top: 8px; }
.install-banner p { margin: 0; color: var(--text-muted); font-size: .85rem; }

/* =========================================================================
   View header
   ========================================================================= */
.view-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.view-header h1 { font-size: 1.3rem; }

/* =========================================================================
   Medicines
   ========================================================================= */
.med-card-list { display: flex; flex-direction: column; gap: 12px; }
.med-card { display: flex; gap: 12px; padding: 14px; }
.med-card__photo {
  width: 56px; height: 56px; border-radius: 14px; overflow: hidden; flex-shrink: 0;
  background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
}
.med-card__photo img { width: 100%; height: 100%; object-fit: cover; }
.med-card__body { flex: 1; min-width: 0; }
.med-card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.med-card__actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

.status-pill {
  font-size: .68rem; font-weight: 700; padding: .25em .7em; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); text-transform: capitalize;
}
.status-pill--paused { background: rgba(255,176,32,0.16); color: #B5780A; }
.status-pill--completed { background: rgba(91,116,129,0.16); color: var(--text-muted); }

.category-pill {
  font-size: .68rem; font-weight: 600; padding: .25em .7em; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); display: inline-block;
}

/* =========================================================================
   Vitals
   ========================================================================= */
.vitals-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.vitals-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 10px; text-align: center; font-weight: 700; }
.vitals-tile__icon { font-size: 1.8rem; }

.info-banner { background: var(--accent-soft); color: var(--accent); padding: 10px 14px; border-radius: var(--radius-sm); font-size: .85rem; }

.chart-card { padding: 12px 8px 6px; margin: 12px 0; }
.chart-empty { text-align: center; color: var(--text-muted); padding: 24px 0; }
.chart-axis-label { font-size: 9px; fill: var(--text-muted); font-family: var(--font-body); }
.chart-legend { display: flex; gap: 14px; justify-content: center; padding: 6px 0 2px; }
.chart-legend-item { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--text-muted); }
.chart-legend-item i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.stats-row { display: flex; gap: 8px; margin-bottom: 12px; }
.stat-pill { flex: 1; background: var(--surface-solid); border: 1px solid var(--surface-border); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
.stat-pill span { display: block; font-size: .7rem; color: var(--text-muted); }
.stat-pill strong { font-family: var(--font-display); }

.reading-list, .reading-row { }
.reading-row {
  display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius-md); margin-bottom: 8px;
}
.reading-row > div { flex: 1; min-width: 0; }
.reading-row__img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }

/* =========================================================================
   Notes / Vault
   ========================================================================= */
.note-card-list { display: flex; flex-direction: column; gap: 10px; }
.note-card { padding: 14px; }
.note-card__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }

.vault-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.vault-card { padding: 10px; position: relative; }
.vault-card__preview {
  aspect-ratio: 4/3; border-radius: var(--radius-sm); overflow: hidden; background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 8px;
}
.vault-card__preview img { width: 100%; height: 100%; object-fit: cover; }
.vault-card button.icon-btn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; background: rgba(255,255,255,0.85); }
:root[dir="rtl"] .vault-card button.icon-btn { right: auto; left: 8px; }

/* =========================================================================
   Timeline / calendar
   ========================================================================= */
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  flex: 0 0 auto; border: 1px solid var(--surface-border); background: var(--surface-solid);
  border-radius: 999px; padding: .45em 1em; font-size: .82rem; white-space: nowrap;
}
.filter-chip--active { background: var(--accent); color: #fff; border-color: var(--accent); }

.timeline-list { display: flex; flex-direction: column; gap: 4px; position: relative; }
.timeline-item {
  display: flex; gap: 12px; padding: 10px 4px; border-left: 2px solid var(--surface-border); padding-left: 16px; position: relative;
}
:root[dir="rtl"] .timeline-item { border-left: none; padding-left: 4px; border-right: 2px solid var(--surface-border); padding-right: 16px;
}
.timeline-item__icon { font-size: 1.1rem; }
.timeline-item__body { display: flex; flex-direction: column; }
.timeline-item__body small { color: var(--text-muted); }
.timeline-list--mini .timeline-item { border: none; padding-left: 4px; }
:root[dir="rtl"] .timeline-list--mini .timeline-item { padding-left: 0; padding-right: 4px; }

.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-grid--head { margin-bottom: 4px; }
.cal-grid--head span { text-align: center; font-size: .72rem; color: var(--text-muted); }
.cal-cell {
  aspect-ratio: 1; border-radius: 12px; background: var(--surface-solid); border: 1px solid var(--surface-border);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .85rem; position: relative;
}
.cal-cell--empty { background: transparent; border: none; }
.cal-cell--today { border-color: var(--accent); font-weight: 700; color: var(--accent); }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); position: absolute; bottom: 6px; }

/* =========================================================================
   Insights
   ========================================================================= */
.insight-list { display: flex; flex-direction: column; gap: 10px; }
.insight-card { padding: 14px 16px; font-size: .92rem; }
.report-sheet__disclaimer { color: var(--text-muted); font-size: .78rem; margin-top: 10px; }
.warning-box { background: rgba(255,176,32,0.12); border-radius: var(--radius-md); padding: 14px; }

/* =========================================================================
   Reports
   ========================================================================= */
.report-controls { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 16px; margin-bottom: 16px; }
.report-controls label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--text-muted); }
.report-controls select { padding: .6em; border-radius: var(--radius-sm); border: 1px solid var(--surface-border); background: var(--surface-solid); }

.report-sheet { padding: 22px; }
.report-sheet__header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--surface-border); }
.report-sheet__header > div:first-child { display: flex; flex-direction: column; }
.report-sheet__brand { font-family: var(--font-display); font-size: 1.1rem; }
.report-sheet__meta { text-align: end; font-weight: 600; display: flex; flex-direction: column; }
.report-block { margin-bottom: 14px; }
.report-block h3 { font-size: .95rem; color: var(--accent); }
.report-list li { padding: 3px 0; font-size: .88rem; border-bottom: 1px dashed var(--surface-border); }
.report-sheet--doctor { background: #fff; color: #111; box-shadow: none; }
.report-sheet--doctor .report-block h3 { color: #0B2233; }
.report-actions { display: flex; gap: 10px; margin-top: 12px; }

/* =========================================================================
   Search
   ========================================================================= */
.search-box input {
  width: 100%; padding: .8em 1em; border-radius: 999px; border: 1px solid var(--surface-border);
  background: var(--surface-solid); box-shadow: var(--shadow-sm);
}
.search-result-list { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.search-result-list a {
  display: flex; align-items: center; gap: 12px; background: var(--surface-solid); border: 1px solid var(--surface-border);
  border-radius: var(--radius-md); padding: 10px 12px;
}
.search-result-list small { display: block; color: var(--text-muted); }

/* =========================================================================
   Settings
   ========================================================================= */
.settings-block { padding: 16px; margin-bottom: 14px; }

<script>
// ==== db.js ====
// db.js — tiny promise-based IndexedDB wrapper for MediSaathi.
// No external dependencies, so the app keeps working fully offline.

const DB_NAME = 'medisaathi-db';
const DB_VERSION = 2;

const STORES = [
  { name: 'persons', keyPath: 'id' },
  { name: 'medicines', keyPath: 'id' },
  { name: 'doseLogs', keyPath: 'id' },
  { name: 'vitalsBP', keyPath: 'id' },
  { name: 'vitalsSugar', keyPath: 'id' },
  { name: 'vitalsWeight', keyPath: 'id' },
  { name: 'vitalsOther', keyPath: 'id' },
  { name: 'notes', keyPath: 'id' },
  { name: 'vault', keyPath: 'id' },
  { name: 'activity', keyPath: 'id' },
  { name: 'water', keyPath: 'id' },
  { name: 'sleep', keyPath: 'id' },
  { name: 'customEntries', keyPath: 'id' },
  { name: 'feelings', keyPath: 'id' },
  { name: 'doctorQuestions', keyPath: 'id' },
  { name: 'emergencyCards', keyPath: 'id' },
  { name: 'settings', keyPath: 'key' }
];

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) {
      reject(new Error('IndexedDB is not supported in this browser.'));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      STORES.forEach((s) => {
        if (!db.objectStoreNames.contains(s.name)) {
          db.createObjectStore(s.name, { keyPath: s.keyPath });
        }
      });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function uid() {
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
}

async function tx(storeName, mode = 'readonly') {
  const db = await openDB();
  const transaction = db.transaction(storeName, mode);
  return transaction.objectStore(storeName);
}

async function getAll(storeName) {
  try {
    const store = await tx(storeName);
    return await new Promise((resolve, reject) => {
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    console.error('getAll failed for', storeName, err);
    return [];
  }
}

async function get(storeName, key) {
  try {
    const store = await tx(storeName);
    return await new Promise((resolve, reject) => {
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    console.error('get failed for', storeName, err);
    return null;
  }
}

async function put(storeName, value) {
  const store = await tx(storeName, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = store.put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}

async function remove(storeName, key) {
  const store = await tx(storeName, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = store.delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

async function clearStore(storeName) {
  const store = await tx(storeName, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = store.clear();
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

async function clearAllData() {
  for (const s of STORES) {
    await clearStore(s.name);
  }
}

async function exportAllData() {
  const data = {};
  for (const s of STORES) {
    data[s.name] = await getAll(s.name);
  }
  data.__meta = { app: 'MediSaathi', exportedAt: new Date().toISOString(), version: DB_VERSION };
  return data;
}

async function importAllData(data) {
  if (!data || typeof data !== 'object') throw new Error('Invalid backup file.');
  for (const s of STORES) {
    if (Array.isArray(data[s.name])) {
      await clearStore(s.name);
      const store = await tx(s.name, 'readwrite');
      for (const item of data[s.name]) {
        store.put(item);
      }
    }
  }
  return true;
}

async function getSetting(key, fallback = null) {
  const row = await get('settings', key);
  return row ? row.value : fallback;
}

async function setSetting(key, value) {
  return put('settings', { key, value });
}

const DB = {
  uid,
  getAll,
  get,
  put,
  remove,
  clearStore,
  clearAllData,
  exportAllData,
  importAllData,
  getSetting,
  setSetting
};

// ==== utils.js ====
// utils.js — small shared helpers used across the app.

function pad2(n) {
  return String(n).padStart(2, '0');
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function nowTimeHM() {
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function isoFromDate(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDateHuman(iso, lang, monthNames) {
  if (!iso) return '';
  const d = parseISO(iso);
  const month = monthNames[d.getMonth()];
  return lang === 'ur' ? `${d.getDate()} ${month} ${d.getFullYear()}` : `${month} ${d.getDate()}, ${d.getFullYear()}`;
}

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return isoFromDate(d);
}

function addDays(iso, n) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + n);
  return isoFromDate(d);
}

function diffDays(isoA, isoB) {
  const a = parseISO(isoA);
  const b = parseISO(isoB);
  return Math.round((a - b) / 86400000);
}

function timeToMinutes(hm) {
  if (!hm) return 0;
  const [h, m] = hm.split(':').map(Number);
  return h * 60 + m;
}

function fileToDataURL(file, maxDim = 1280, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file) { resolve(null); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      // Downscale images so IndexedDB doesn't balloon in size.
      if (!file.type.startsWith('image/')) {
        resolve({ dataURL: reader.result, type: file.type, isImage: false, name: file.name });
        return;
      }
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataURL = canvas.toDataURL('image/jpeg', quality);
        resolve({ dataURL, type: 'image/jpeg', isImage: true, name: file.name });
      };
      img.onerror = () => resolve({ dataURL: reader.result, type: file.type, isImage: false, name: file.name });
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function average(nums) {
  if (!nums.length) return null;
  return nums.reduce((a, b) => a + b, 0) / nums.length;
}

function round1(n) {
  return Math.round(n * 10) / 10;
}

let toastTimer = null;
function showToast(message) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.add('toast--visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('toast--visible'), 2600);
}

function confirmDialog(message) {
  // Wraps window.confirm so behaviour is easy to swap out later if desired.
  return window.confirm(message);
}

function debounce(fn, wait = 200) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), wait);
  };
}

const U = { pad2, todayISO, nowTimeHM, isoFromDate, parseISO, formatDateHuman, daysAgo, addDays, diffDays, timeToMinutes, fileToDataURL, escapeHTML, average, round1, showToast, confirmDialog, debounce };

// ==== charts.js ====
// charts.js — minimal, dependency-free SVG chart renderer.
// Kept intentionally small: no CDN chart library is loaded, so charts
// keep working even fully offline on GitHub Pages.

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

/**
 * Renders a simple line chart into `container`.
 * series: [{ label, values: [{x:number index, y:number, dateLabel:string}], color }]
 */
function renderLineChart(container, { series, yLabelFormatter, emptyText, height = 180 }) {
  container.innerHTML = '';
  const allPoints = series.flatMap((s) => s.values);
  if (!allPoints.length) {
    container.innerHTML = `<p class="chart-empty">${emptyText}</p>`;
    return;
  }
  const width = Math.max(container.clientWidth || 320, 280);
  const padding = { top: 16, right: 16, bottom: 28, left: 40 };
  const ys = allPoints.map((p) => p.y);
  let min = Math.min(...ys);
  let max = Math.max(...ys);
  if (min === max) { min -= 1; max += 1; }
  const range = max - min;
  min -= range * 0.1;
  max += range * 0.1;

  const xCount = Math.max(...series.map((s) => s.values.length), 2);
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, width: '100%', height, role: 'img', 'aria-label': 'trend chart' });

  // Gridlines + y labels
  const gridCount = 4;
  for (let i = 0; i <= gridCount; i++) {
    const yVal = min + ((max - min) * i) / gridCount;
    const yPos = padding.top + innerH - (innerH * i) / gridCount;
    const line = svgEl('line', {
      x1: padding.left, x2: width - padding.right, y1: yPos, y2: yPos,
      stroke: 'var(--chart-grid, rgba(120,140,150,0.18))', 'stroke-width': 1
    });
    svg.appendChild(line);
    const label = svgEl('text', {
      x: padding.left - 8, y: yPos + 4, 'text-anchor': 'end',
      class: 'chart-axis-label'
    });
    label.textContent = yLabelFormatter ? yLabelFormatter(yVal) : Math.round(yVal);
    svg.appendChild(label);
  }

  series.forEach((s) => {
    if (!s.values.length) return;
    const points = s.values.map((p, i) => {
      const x = padding.left + (s.values.length > 1 ? (innerW * i) / (s.values.length - 1) : innerW / 2);
      const y = padding.top + innerH - ((p.y - min) / (max - min)) * innerH;
      return { x, y, ...p };
    });
    const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const path = svgEl('path', { d: pathD, fill: 'none', stroke: s.color || 'var(--accent)', 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    svg.appendChild(path);

    points.forEach((p) => {
      const dot = svgEl('circle', { cx: p.x, cy: p.y, r: 3.5, fill: s.color || 'var(--accent)' });
      const title = svgEl('title', {});
      title.textContent = `${p.dateLabel || ''}: ${p.y}`;
      dot.appendChild(title);
      svg.appendChild(dot);
    });

    // x-axis labels (first, middle, last only, to avoid clutter)
    const labelIdxs = new Set([0, points.length - 1, Math.floor(points.length / 2)]);
    labelIdxs.forEach((idx) => {
      const p = points[idx];
      if (!p) return;
      const label = svgEl('text', { x: p.x, y: height - 6, 'text-anchor': 'middle', class: 'chart-axis-label' });
      label.textContent = p.dateLabel || '';
      svg.appendChild(label);
    });
  });

  container.appendChild(svg);

  if (series.length > 1) {
    const legend = document.createElement('div');
    legend.className = 'chart-legend';
    series.forEach((s) => {
      const item = document.createElement('span');
      item.className = 'chart-legend-item';
      item.innerHTML = `<i style="background:${s.color || 'var(--accent)'}"></i>${s.label}`;
      legend.appendChild(item);
    });
    container.appendChild(legend);
  }
}

/**
 * Renders a simple vertical bar chart.
 * bars: [{ label, value, color }]
 */
function renderBarChart(container, { bars, emptyText, height = 160, valueFormatter }) {
  container.innerHTML = '';
  if (!bars.length || bars.every((b) => !b.value)) {
    container.innerHTML = `<p class="chart-empty">${emptyText}</p>`;
    return;
  }
  const width = Math.max(container.clientWidth || 320, 280);
  const padding = { top: 16, right: 12, bottom: 28, left: 12 };
  const max = Math.max(...bars.map((b) => b.value), 1);
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const barGap = 10;
  const barW = Math.max((innerW - barGap * (bars.length - 1)) / bars.length, 8);

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, width: '100%', height, role: 'img', 'aria-label': 'bar chart' });

  bars.forEach((b, i) => {
    const barH = (b.value / max) * innerH;
    const x = padding.left + i * (barW + barGap);
    const y = padding.top + innerH - barH;
    const rect = svgEl('rect', { x, y, width: barW, height: Math.max(barH, 2), rx: 6, fill: b.color || 'var(--accent)' });
    const title = svgEl('title', {});
    title.textContent = `${b.label}: ${valueFormatter ? valueFormatter(b.value) : b.value}`;
    rect.appendChild(title);
    svg.appendChild(rect);

    const label = svgEl('text', { x: x + barW / 2, y: height - 6, 'text-anchor': 'middle', class: 'chart-axis-label' });
    label.textContent = b.label;
    svg.appendChild(label);
  });

  container.appendChild(svg);
}

/**
 * Renders a compact circular progress ring (used for today's adherence).
 */
function renderProgressRing(container, { percent, label, sublabel }) {
  container.innerHTML = '';
  const size = 108;
  const stroke = 10;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (Math.min(Math.max(percent, 0), 100) / 100) * c;

  const svg = svgEl('svg', { viewBox: `0 0 ${size} ${size}`, width: size, height: size, role: 'img', 'aria-label': label });
  const bg = svgEl('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: 'var(--ring-track, rgba(120,140,150,0.18))', 'stroke-width': stroke });
  const fg = svgEl('circle', {
    cx: size / 2, cy: size / 2, r, fill: 'none', stroke: 'var(--accent)', 'stroke-width': stroke,
    'stroke-linecap': 'round', 'stroke-dasharray': c, 'stroke-dashoffset': offset,
    transform: `rotate(-90 ${size / 2} ${size / 2})`
  });
  fg.classList.add('ring-progress');
  svg.appendChild(bg);
  svg.appendChild(fg);
  container.appendChild(svg);

  const textWrap = document.createElement('div');
  textWrap.className = 'ring-text';
  textWrap.innerHTML = `<strong>${Math.round(percent)}%</strong><span>${sublabel || ''}</span>`;
  container.appendChild(textWrap);
}

// Forces Chromium/WebView to fully recompute layout & repaint after a live
// dir="rtl"/"ltr" change, working around a real compositor bug where
// backdrop-filter layers and logical-property offsets (border-inline-*,
// inset-inline-*) can freeze at their pre-toggle position on some Android
// Chrome/WebView builds, producing a squashed/blank layout until reload.
function forceRepaint() {
  const el = document.body;
  el.style.display = 'none';
  // eslint-disable-next-line no-unused-expressions
  void el.offsetHeight;
  el.style.display = '';
}

function route() {
  const [path] = window.location.hash.split('?');
  const handler = ROUTES[path] || ROUTES[window.location.hash] || renderDashboard;
  document.querySelectorAll('.nav-btn').forEach((b) => {
    b.classList.toggle('nav-btn--active', b.dataset.route === (path || '#/dashboard'));
    b.setAttribute('aria-current', b.dataset.route === (path || '#/dashboard') ? 'page' : 'false');
  });
  app.setAttribute('aria-busy', 'true');
  try {
    handler(window.location.hash);
  } catch (err) {
    console.error(err);
    app.innerHTML = errorState();
  }
  app.setAttribute('aria-busy', 'false');
  app.scrollTop = 0;
  window.scrollTo(0, 0);
}

}

const modalRoot = document.getElementById('modal-root');

function openModal({ title, bodyHTML, onOpen, wide }) {
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal ${wide ? 'modal--wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal__header">
          <h2 id="modal-title">${title}</h2>
          <button class="icon-btn" id="modal-close" aria-label="${t('common_close')}">✕</button>
        </div>
        <div class="modal__body">${bodyHTML}</div>
      </div>
    </div>`;
  const backdrop = document.getElementById('modal-backdrop');
  const modal = backdrop.querySelector('.modal');
  document.getElementById('modal-close').addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', escCloseOnce);
  if (onOpen) onOpen(modal);
  const firstInput = modal.querySelector('input, textarea, select, button');
  if (firstInput) firstInput.focus();
}

function escCloseOnce(e) {
  if (e.key === 'Escape') closeModal();
}

function closeModal() {
  modalRoot.innerHTML = '';
  document.removeEventListener('keydown', escCloseOnce);
}

// ---------------------------------------------------------------------------
// Informational clinical-range feedback (never a diagnosis — see disclaimers)
// ---------------------------------------------------------------------------
function feedbackPillHTML(level) {
  const map = {
    ok: ['feedback_within_range', 'feedback-pill--ok'],
    watch: ['feedback_above_range', 'feedback-pill--watch'],
    low: ['feedback_below_range', 'feedback-pill--watch'],
    attention: ['feedback_needs_attention', 'feedback-pill--attention']
  };
  const [labelKey, cls] = map[level] || map.ok;
  return `<span class="feedback-pill ${cls}">${t(labelKey)}</span>`;
}

function bpFeedback(systolic, diastolic) {
  const s = Number(systolic), d = Number(diastolic);
  if (s >= 180 || d >= 120) return 'attention';
  if (s >= 130 || d >= 80) return 'watch';
  if (s < 90 || d < 60) return 'low';
  return 'ok';
}

function sugarFeedback(value, context) {
  const v = Number(value);
  if (context === 'before') {
    if (v >= 126) return 'attention';
    if (v >= 100) return 'watch';
    if (v < 70) return 'low';
    return 'ok';
  }
  if (v >= 200) return 'attention';
  if (v >= 140) return 'watch';
  if (v < 70) return 'low';
  return 'ok';
}

function heartRateFeedback(bpm) {
  const v = Number(bpm);
  if (v > 130 || v < 40) return 'attention';
  if (v > 100) return 'watch';
  if (v < 60) return 'low';
  return 'ok';
}

function spo2Feedback(pct) {
  const v = Number(pct);
  if (v < 90) return 'attention';
  if (v < 95) return 'watch';
  return 'ok';
}

function temperatureFeedback(celsius) {
  const v = Number(celsius);
  if (v >= 39) return 'attention';
  if (v >= 38 || v < 35) return 'watch';
  return 'ok';
}

function getGreetingKey() {
  const h = new Date().getHours();
  if (h < 12) return 'greeting_morning';
  if (h < 17) return 'greeting_afternoon';
  if (h < 21) return 'greeting_evening';
  return 'greeting_night';
}

// ---------------------------------------------------------------------------
// Dose helpers (medicines <-> today's timeline)
// ---------------------------------------------------------------------------
function scheduleTimesForMedicine(med) {
  const slotTimes = { morning: '08:00', afternoon: '13:00', evening: '18:00', night: '21:30' };
  const times = [];
  (med.schedule || []).forEach((slot) => {
    if (slotTimes[slot]) times.push(slotTimes[slot]);
  });
  (med.customTimes || []).forEach((ct) => { if (ct) times.push(ct); });
  return [...new Set(times)].sort();
}

function isMedicineActiveOn(med, iso) {
  if (med.status === 'paused') return false;
  if (med.startDate && iso < med.startDate) return false;
  if (med.endDate && iso > med.endDate) return false;
  return true;
}

function buildTodaysDoseList(meds, doseLogs, iso) {
  const rows = [];
  meds.forEach((med) => {
    if (!isMedicineActiveOn(med, iso)) return;
    scheduleTimesForMedicine(med).forEach((time) => {
      const log = doseLogs.find((l) => l.medicineId === med.id && l.date === iso && l.time === time);
      let status = log ? log.status : 'upcoming';
      if (!log && U.timeToMinutes(time) < U.timeToMinutes(U.nowTimeHM()) - 30) status = 'upcoming';
      rows.push({ medId: med.id, medName: med.name, medPhoto: med.photo, time, status, dosage: med.dosage, unit: med.unit });
    });
  });
  return rows.sort((a, b) => a.time.localeCompare(b.time));
}

function doseRowHTML(row) {
  const statusIcon = { taken: '✅', missed: '⚠️', skipped: '⏭️', upcoming: '🕒' };
  return `<li class="dose-row dose-row--${row.status}">
    <span class="dose-row__time">${row.time}</span>
    <span class="dose-row__avatar">${row.medPhoto ? `<img src="${row.medPhoto}" alt="">` : '💊'}</span>
    <span class="dose-row__info">
      <strong>${U.escapeHTML(row.medName)}</strong>
      <small>${U.escapeHTML(row.dosage || '')} ${U.escapeHTML(row.unit || '')}</small>
    </span>
    <span class="dose-row__status" title="${t('dose_' + row.status)}">${statusIcon[row.status]}</span>
    <span class="dose-row__actions">
      ${row.status !== 'taken' ? `<button class="chip-btn chip-btn--taken" data-mark="taken" data-med-id="${row.medId}" data-time="${row.time}" aria-label="${t('mark_taken')}">✓</button>` : ''}
      ${row.status !== 'missed' && row.status !== 'taken' ? `<button class="chip-btn chip-btn--missed" data-mark="missed" data-med-id="${row.medId}" data-time="${row.time}" aria-label="${t('mark_missed')}">✕</button>` : ''}
    </span>
  </li>`;
}

async function markDose(medId, time, status, iso) {
  const logs = await DB.getAll('doseLogs');
  const existing = logs.find((l) => l.medicineId === medId && l.date === iso && l.time === time);
  const entry = existing || { id: DB.uid(), medicineId: medId, personId: state.personId, date: iso, time };
  entry.status = status;
  entry.loggedAt = Date.now();
  await DB.put('doseLogs', entry);
  U.showToast(t('common_saved'));
  route();
}

async function renderMedicines() {
  topbarTitle.textContent = t('nav_medicines');
  const person = currentPerson();
  const meds = (await DB.getAll('medicines')).filter((m) => m.personId === person.id)
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  app.innerHTML = `
    <div class="view-header">
      <h1>${t('med_title')}</h1>
      <button class="btn btn--primary" id="add-med-btn">+ ${t('med_add')}</button>
    </div>
    ${meds.length ? `<ul class="med-card-list">${meds.map(medCardHTML).join('')}</ul>` : `
      <div class="empty-state">
        <div class="empty-state__icon">💊</div>
        <h2>${t('med_empty')}</h2>
        <p>${t('med_empty_hint')}</p>
        <button class="btn btn--primary" id="add-med-btn-2">+ ${t('med_add')}</button>
      </div>`}
  `;
  const addBtn = document.getElementById('add-med-btn');
  if (addBtn) addBtn.addEventListener('click', () => openMedicineForm());
  const addBtn2 = document.getElementById('add-med-btn-2');
  if (addBtn2) addBtn2.addEventListener('click', () => openMedicineForm());

  app.querySelectorAll('[data-edit-med]').forEach((btn) => btn.addEventListener('click', () => openMedicineForm(btn.dataset.editMed)));
  app.querySelectorAll('[data-delete-med]').forEach((btn) => btn.addEventListener('click', () => deleteMedicine(btn.dataset.deleteMed)));
  app.querySelectorAll('[data-toggle-med]').forEach((btn) => btn.addEventListener('click', () => toggleMedicineStatus(btn.dataset.toggleMed)));
}

function medCardHTML(med) {
  const low = med.quantityRemaining !== '' && med.quantityRemaining !== undefined && med.refillAt !== '' && med.refillAt !== undefined
    && Number(med.quantityRemaining) <= Number(med.refillAt);
  const times = scheduleTimesForMedicine(med).join(' · ');
  return `<li class="med-card glass">
    <div class="med-card__photo">${med.photo ? `<img src="${med.photo}" alt="">` : '💊'}</div>
    <div class="med-card__body">
      <div class="med-card__top">
        <strong>${U.escapeHTML(med.name)}</strong>
        <span class="status-pill status-pill--${med.status}">${t('med_status_' + med.status)}</span>
      </div>
      <p class="muted">${U.escapeHTML(med.dosage || '')} ${U.escapeHTML(med.unit || '')} · ${times || '—'}</p>
      ${med.purpose ? `<p class="muted">${U.escapeHTML(med.purpose)}</p>` : ''}
      ${low ? `<p class="warning-text">⚠️ ${t('med_low_stock')}</p>` : ''}
      <div class="med-card__actions">
        <button class="btn btn--soft btn--sm" data-edit-med="${med.id}">${t('common_edit')}</button>
        <button class="btn btn--soft btn--sm" data-toggle-med="${med.id}">${med.status === 'paused' ? t('med_status_active') : t('med_status_paused')}</button>
        <button class="btn btn--danger btn--sm" data-delete-med="${med.id}">${t('common_delete')}</button>
      </div>
    </div>
  </li>`;
}

async function toggleMedicineStatus(id) {
  const med = await DB.get('medicines', id);
  if (!med) return;
  med.status = med.status === 'paused' ? 'active' : 'paused';
  await DB.put('medicines', med);
  route();
}

async function deleteMedicine(id) {
  if (!U.confirmDialog(t('med_delete_confirm'))) return;
  await DB.remove('medicines', id);
  const logs = await DB.getAll('doseLogs');
  for (const l of logs.filter((l) => l.medicineId === id)) await DB.remove('doseLogs', l.id);
  U.showToast(t('common_deleted'));
  route();
}

function openMedicineForm(editId) {
  buildMedicineFormModal(editId);
}

  openModal({
    title: med ? t('med_edit') : t('med_add'),
    wide: true,
    bodyHTML: `
      <form id="med-form" class="form">
        <label>${t('med_name')}<input required name="name" type="text" value="${U.escapeHTML(med?.name || '')}"></label>
        <div class="form-group-label">${t('med_photo')} <span class="muted">(${t('common_optional')})</span></div>
        <div class="photo-preview-row" id="med-photo-preview-row">
          ${med?.photo ? `<img class="form-photo-preview" src="${med.photo}" alt="">` : ''}
        </div>
        <div class="photo-picker-row">
          <button type="button" class="btn btn--soft" id="med-take-photo-btn">📷 ${t('photo_take')}</button>
          <button type="button" class="btn btn--soft" id="med-gallery-photo-btn">🖼️ ${t('photo_gallery')}</button>
          <button type="button" class="btn btn--danger" id="med-remove-photo-btn" ${med?.photo ? '' : 'hidden'}>${t('photo_remove')}</button>
        </div>
        <input name="photoCamera" type="file" accept="image/*" capture="environment" hidden>
        <input name="photoGallery" type="file" accept="image/*" hidden>
        <div class="form-row">
          <label>${t('med_dosage')}<input name="dosage" type="text" value="${U.escapeHTML(med?.dosage || '')}" placeholder="e.g. 500"></label>
          <label>${t('med_unit')}<input name="unit" type="text" value="${U.escapeHTML(med?.unit || '')}" placeholder="mg / tablet / ml"></label>
        </div>
        <fieldset class="checkbox-group">
          <legend>${t('med_schedule')}</legend>
          ${['morning', 'afternoon', 'evening', 'night'].map((slot) => `
            <label class="checkbox-pill"><input type="checkbox" name="schedule" value="${slot}" ${schedule.includes(slot) ? 'checked' : ''}> ${t('med_' + slot)}</label>
          `).join('')}
        </fieldset>
        <label>${t('med_custom_time')} <span class="muted">(${t('common_optional')})</span><input name="customTime" type="time" value="${med?.customTimes?.[0] || ''}"></label>
        <div class="form-row">
          <label>${t('med_start_date')}<input name="startDate" type="date" value="${med?.startDate || U.todayISO()}"></label>
          <label>${t('med_end_date')}<input name="endDate" type="date" value="${med?.endDate || ''}"></label>
        </div>
        <label>${t('med_instruction')}
          <select name="instruction">
            <option value="before_food" ${med?.instruction === 'before_food' ? 'selected' : ''}>${t('med_before_food')}</option>
            <option value="after_food" ${med?.instruction === 'after_food' ? 'selected' : ''}>${t('med_after_food')}</option>
            <option value="with_food" ${med?.instruction === 'with_food' ? 'selected' : ''}>${t('med_with_food')}</option>
            <option value="other" ${med?.instruction === 'other' ? 'selected' : ''}>${t('med_other')}</option>
          </select>
        </label>
        <label>${t('med_purpose')}<input name="purpose" type="text" value="${U.escapeHTML(med?.purpose || '')}"></label>
        <div class="form-row">
          <label>${t('med_quantity')}<input name="quantityRemaining" type="number" min="0" value="${med?.quantityRemaining ?? ''}"></label>
          <label>${t('med_refill_at')}<input name="refillAt" type="number" min="0" value="${med?.refillAt ?? ''}"></label>
        </div>
        <label>${t('med_notes')}<textarea name="notes" rows="2">${U.escapeHTML(med?.notes || '')}</textarea></label>
        <div class="form-actions">
          <button type="button" class="btn btn--ghost" id="cancel-med">${t('common_cancel')}</button>
          <button type="submit" class="btn btn--primary">${t('common_save')}</button>
        </div>
      </form>`,
    onOpen: (modal) => {
      let currentPhoto = med?.photo || null;
      const cameraInput = modal.querySelector('input[name=photoCamera]');
      const galleryInput = modal.querySelector('input[name=photoGallery]');
      const previewRow = modal.querySelector('#med-photo-preview-row');
      const removeBtn = modal.querySelector('#med-remove-photo-btn');

      const updatePreview = () => {
        previewRow.innerHTML = currentPhoto ? `<img class="form-photo-preview" src="${currentPhoto}" alt="">` : '';
        removeBtn.hidden = !currentPhoto;
      };
      const handlePicked = async (file) => {
        if (!file || !file.size) return;
        const result = await U.fileToDataURL(file);
        if (result) { currentPhoto = result.dataURL; updatePreview(); }
      };
      modal.querySelector('#med-take-photo-btn').addEventListener('click', () => cameraInput.click());
      modal.querySelector('#med-gallery-photo-btn').addEventListener('click', () => galleryInput.click());
      cameraInput.addEventListener('change', (e) => handlePicked(e.target.files[0]));
      galleryInput.addEventListener('change', (e) => handlePicked(e.target.files[0]));
      removeBtn.addEventListener('click', () => { currentPhoto = null; updatePreview(); });

      modal.querySelector('#cancel-med').addEventListener('click', closeModal);
      modal.querySelector('#med-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        if (!fd.get('name').trim()) { U.showToast(t('common_required_field')); return; }
        const record = {
          id: med?.id || DB.uid(),
          personId: state.personId,
          name: fd.get('name').trim(),
          photo: currentPhoto,
          dosage: fd.get('dosage').trim(),
          unit: fd.get('unit').trim(),
          schedule: fd.getAll('schedule'),
          customTimes: fd.get('customTime') ? [fd.get('customTime')] : [],
          frequency: 'daily',
          startDate: fd.get('startDate') || U.todayISO(),
          endDate: fd.get('endDate') || '',
          instruction: fd.get('instruction'),
          purpose: fd.get('purpose').trim(),
          quantityRemaining: fd.get('quantityRemaining'),
          refillAt: fd.get('refillAt'),
          notes: fd.get('notes').trim(),
          status: med?.status || 'active',
          createdAt: med?.createdAt || Date.now()
        };
        await DB.put('medicines', record);
        closeModal();
        U.showToast(t('common_saved'));
        route();
      });
    }
  });
}

const VITAL_CONFIG = {
  bp: { store: 'vitalsBP', titleKey: 'vitals_bp', emptyKey: 'bp_empty' },
  sugar: { store: 'vitalsSugar', titleKey: 'vitals_sugar', emptyKey: 'sugar_empty' },
  weight: { store: 'vitalsWeight', titleKey: 'vitals_weight', emptyKey: 'weight_empty' },
  other: { store: 'vitalsOther', titleKey: 'vitals_other', emptyKey: 'weight_empty' }
};

async function renderVitalDetail(kind) {
  const cfg = VITAL_CONFIG[kind];
  topbarTitle.textContent = t(cfg.titleKey);
  const person = currentPerson();
  const all = (await DB.getAll(cfg.store)).filter((v) => v.personId === person.id)
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));

  app.innerHTML = `
    <div class="view-header">

    <div id="vital-chart" class="chart-card glass"></div>

    ${all.length ? `<ul class="reading-list">${all.map((v) => vitalRowHTML(kind, v)).join('')}</ul>` : `

        <div class="empty-state__icon">📋</div>
        <h2>${t(cfg.emptyKey)}</h2>
        <button class="btn btn--primary" id="add-vital-btn-2">+ ${t('common_add')}</button>
      </div>`}

  renderVitalChart(kind, all);

  document.getElementById('add-vital-btn')?.addEventListener('click', () => openVitalForm(kind));

  app.querySelectorAll('[data-delete-vital]').forEach((btn) => btn.addEventListener('click', () => deleteVital(cfg.store, btn.dataset.deleteVital)));
}

function statsRowHTML(kind, all) {
  if (kind === 'bp') {
    const sys = all.map((v) => Number(v.systolic));
    const dia = all.map((v) => Number(v.diastolic));
    return `<div class="stats-row">
      <div class="stat-pill"><span>${t('bp_average')}</span><strong>${Math.round(U.average(sys))}/${Math.round(U.average(dia))}</strong></div>
      <div class="stat-pill"><span>${t('bp_highest')}</span><strong>${Math.max(...sys)}/${Math.max(...dia)}</strong></div>
      <div class="stat-pill"><span>${t('bp_lowest')}</span><strong>${Math.min(...sys)}/${Math.min(...dia)}</strong></div>
    </div>`;
  }
  if (kind === 'weight' && all.length) {
    const sorted = [...all].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const current = Number(sorted[sorted.length - 1].value);
    const prev = sorted.length > 1 ? Number(sorted[sorted.length - 2].value) : current;
    const change = U.round1(current - prev);
    return `<div class="stats-row">
      <div class="stat-pill"><span>${t('weight_current')}</span><strong>${current} kg</strong></div>
      <div class="stat-pill"><span>${t('weight_previous')}</span><strong>${prev} kg</strong></div>
      <div class="stat-pill"><span>${t('weight_change')}</span><strong class="${change > 0 ? 'up' : change < 0 ? 'down' : ''}">${change > 0 ? '+' : ''}${change} kg</strong></div>
    </div>`;
  }
  if (kind === 'sugar') {
    const vals = all.map((v) => Number(v.value));
    return `<div class="stats-row">
      <div class="stat-pill"><span>${t('bp_average')}</span><strong>${Math.round(U.average(vals))} mg/dL</strong></div>
      <div class="stat-pill"><span>${t('bp_highest')}</span><strong>${Math.max(...vals)}</strong></div>
      <div class="stat-pill"><span>${t('bp_lowest')}</span><strong>${Math.min(...vals)}</strong></div>
    </div>`;
  }
  return '';
}

function renderVitalChart(kind, all) {
  const container = document.getElementById('vital-chart');
  const sorted = [...all].sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))).slice(-20);
  if (kind === 'bp') {
    renderLineChart(container, {
      emptyText: t(VITAL_CONFIG.bp.emptyKey),
      series: [
        { label: t('bp_systolic'), color: '#0EA5A0', values: sorted.map((v, i) => ({ x: i, y: Number(v.systolic), dateLabel: v.date.slice(5) })) },
        { label: t('bp_diastolic'), color: '#FF8A5B', values: sorted.map((v, i) => ({ x: i, y: Number(v.diastolic), dateLabel: v.date.slice(5) })) }
      ]
    });
  } else if (kind === 'sugar') {
    renderLineChart(container, {
      emptyText: t(VITAL_CONFIG.sugar.emptyKey),
      series: [{ label: t('vitals_sugar'), color: '#6C63FF', values: sorted.map((v, i) => ({ x: i, y: Number(v.value), dateLabel: v.date.slice(5) })) }]
    });
  } else if (kind === 'weight') {
    renderLineChart(container, {
      emptyText: t(VITAL_CONFIG.weight.emptyKey),
      series: [{ label: t('vitals_weight'), color: '#2FB380', values: sorted.map((v, i) => ({ x: i, y: Number(v.value), dateLabel: v.date.slice(5) })) }]
    });
  } else {
    const grouped = {};
    sorted.forEach((v) => { (grouped[v.type] = grouped[v.type] || []).push(v); });
    const first = Object.keys(grouped)[0];
    if (!first) { container.innerHTML = `<p class="chart-empty">${t('weight_empty')}</p>`; return; }
    renderLineChart(container, {
      emptyText: t('weight_empty'),
      series: [{ label: t('other_' + first) || first, color: '#3D8BFD', values: grouped[first].map((v, i) => ({ x: i, y: Number(v.value), dateLabel: v.date.slice(5) })) }]
    });
  }
}

function vitalRowHTML(kind, v) {
  let valueText = '';
  let feedback = null;
  if (kind === 'bp') {
    valueText = `${v.systolic}/${v.diastolic} mmHg${v.pulse ? ` · ${v.pulse} bpm` : ''}`;
    feedback = bpFeedback(v.systolic, v.diastolic);
  } else if (kind === 'sugar') {
    valueText = `${v.value} mg/dL — ${t('sugar_' + (v.context || 'other').replace('before', 'before_meal').replace('after', 'after_meal'))}`;
    feedback = sugarFeedback(v.value, v.context);
  } else if (kind === 'weight') {
    valueText = `${v.value} kg`;
  } else {
    valueText = `${v.value} ${v.unit || ''} — ${t('other_' + v.type) || v.type}`;
    if (v.type === 'heartrate') feedback = heartRateFeedback(v.value);
    else if (v.type === 'spo2') feedback = spo2Feedback(v.value);
    else if (v.type === 'temperature') feedback = temperatureFeedback(v.value);
  }

  return `<li class="reading-row glass">
    <div>
      <strong>${valueText}</strong>
      <p class="muted">${v.date} ${v.time || ''} ${v.period ? '· ' + t('med_' + v.period) : ''}</p>
      ${feedback ? feedbackPillHTML(feedback) : ''}
      ${v.note ? `<p class="muted">${U.escapeHTML(v.note)}</p>` : ''}
    </div>
    ${v.image ? `<img class="reading-row__img" src="${v.image}" alt="">` : ''}
    <button class="icon-btn" data-delete-vital="${v.id}" aria-label="${t('common_delete')}">🗑️</button>
  </li>`;
}

        if (file && file.size) {

          if (result) image = result.dataURL;
        }
        const base = {
          id: DB.uid(), personId: state.personId,
          date: fd.get('date') || U.todayISO(), time: fd.get('time') || U.nowTimeHM(),
          note: (fd.get('note') || '').trim(), image, createdAt: Date.now()
        };
        let record;
        if (kind === 'bp') record = { ...base, systolic: fd.get('systolic'), diastolic: fd.get('diastolic'), pulse: fd.get('pulse'), period: fd.get('period') };
        else if (kind === 'sugar') record = { ...base, value: fd.get('value'), context: fd.get('context') };
        else if (kind === 'weight') record = { ...base, value: fd.get('value') };
        else record = { ...base, value: fd.get('value'), unit: fd.get('unit'), type: fd.get('type') };
        await DB.put(cfg.store, record);
        closeModal();
        U.showToast(t('common_saved'));
        route();
      });
    }
  });
}

function formatDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return h > 0 ? `${U.pad2(h)}:${U.pad2(m)}:${U.pad2(s)}` : `${U.pad2(m)}:${U.pad2(s)}`;
}

function activityRowHTML(a) {
  return `<div class="list-row">
    <div>
      <strong>${a.durationLabel || formatDuration(a.durationMs || 0)}</strong>
      <p class="muted">${a.date} ${a.distanceKm ? `· ${a.distanceKm} km` : ''} ${a.steps ? `· ${a.steps} ${t('activity_steps').toLowerCase()}` : ''}</p>

  </div>`;

function updateActivityTimerDisplay() {
  const el = document.getElementById('activity-timer');
  if (!el) { clearInterval(activityTimerInterval); return; }
  const walk = state.activeWalk;
  if (!walk) { el.textContent = '00:00'; return; }
  const elapsed = walk.status === 'running' ? (walk.elapsedMs + (Date.now() - walk.startTs)) : walk.elapsedMs;
  el.textContent = formatDuration(elapsed);
}

function renderActivityControls() {
  const el = document.getElementById('activity-controls');
  if (!el) return;
  const walk = state.activeWalk;
  if (!walk) {
    el.innerHTML = `<button class="btn btn--primary" id="walk-start">▶ ${t('activity_start')}</button>`;
    el.querySelector('#walk-start').addEventListener('click', () => {
      state.activeWalk = { status: 'running', startTs: Date.now(), elapsedMs: 0 };
      renderActivityControls();
    });
  } else if (walk.status === 'running') {
    el.innerHTML = `
      <button class="btn btn--soft" id="walk-pause">⏸ ${t('common_pause')}</button>
      <button class="btn btn--danger" id="walk-stop">⏹ ${t('common_stop')}</button>`;
    el.querySelector('#walk-pause').addEventListener('click', () => {
      walk.elapsedMs += Date.now() - walk.startTs;
      walk.status = 'paused';
      renderActivityControls();
    });
    el.querySelector('#walk-stop').addEventListener('click', () => stopWalk());
  } else {
    el.innerHTML = `
      <button class="btn btn--primary" id="walk-resume">▶ ${t('common_resume')}</button>
      <button class="btn btn--danger" id="walk-stop">⏹ ${t('common_stop')}</button>`;
    el.querySelector('#walk-resume').addEventListener('click', () => {
      walk.startTs = Date.now();
      walk.status = 'running';
      renderActivityControls();
    });
    el.querySelector('#walk-stop').addEventListener('click', () => stopWalk());
  }
}

async function stopWalk() {
  const walk = state.activeWalk;
  if (!walk) return;
  const totalMs = walk.status === 'running' ? walk.elapsedMs + (Date.now() - walk.startTs) : walk.elapsedMs;
  state.activeWalk = null;
  const record = {
    id: DB.uid(), personId: state.personId, date: U.todayISO(), durationMs: totalMs,
    durationLabel: formatDuration(totalMs), createdAt: Date.now()
  };
  await DB.put('activity', record);
  U.showToast(t('common_saved'));
  route();
}

function sleepDurationLabel(bed, wake) {
  if (!bed || !wake) return '';
  let bedMin = U.timeToMinutes(bed);
  let wakeMin = U.timeToMinutes(wake);
  if (wakeMin <= bedMin) wakeMin += 24 * 60;
  const diff = wakeMin - bedMin;
  return `${Math.floor(diff / 60)}h ${diff % 60}m`;
}

async function generateDoctorVisit() {
  const personId = document.getElementById('dv-person').value;
  const days = Number(document.getElementById('dv-range').value);
  const person = state.persons.find((p) => p.id === personId);
  const startISO = U.daysAgo(days);
  const inRange = (d) => d >= startISO;

  const [doseLogs, bp, sugar, weight, activity, water, sleep, dq] = await Promise.all([
    DB.getAll('doseLogs'), DB.getAll('vitalsBP'), DB.getAll('vitalsSugar'), DB.getAll('vitalsWeight'),
    DB.getAll('activity'), DB.getAll('water'), DB.getAll('sleep'), DB.getAll('doctorQuestions')

// ---------------------------------------------------------------------------
// Timeline
// ---------------------------------------------------------------------------
async function buildTimelineEvents(personId, limit) {
  const [meds, doseLogs, bp, sugar, weight, other, notes, vault, activity, water, sleep, dq] = await Promise.all([
    DB.getAll('medicines'), DB.getAll('doseLogs'), DB.getAll('vitalsBP'), DB.getAll('vitalsSugar'),
    DB.getAll('vitalsWeight'), DB.getAll('vitalsOther'), DB.getAll('notes'), DB.getAll('vault'),
    DB.getAll('activity'), DB.getAll('water'), DB.getAll('sleep'), DB.getAll('doctorQuestions')
  ]);
  const medMap = Object.fromEntries(meds.map((m) => [m.id, m]));
  const events = [];

  doseLogs.filter((l) => l.personId === personId && (l.status === 'taken' || l.status === 'missed')).forEach((l) => {
    events.push({ ts: `${l.date}T${l.time}`, date: l.date, category: 'medicine', icon: l.status === 'taken' ? '✅' : '⚠️',
      text: `${medMap[l.medicineId]?.name || t('nav_medicines')} — ${t('dose_' + l.status)}` });
  });
  bp.filter((v) => v.personId === personId).forEach((v) => events.push({ ts: `${v.date}T${v.time || '00:00'}`, date: v.date, category: 'bp', icon: '🩺', text: `${t('vitals_bp')}: ${v.systolic}/${v.diastolic}` }));
  sugar.filter((v) => v.personId === personId).forEach((v) => events.push({ ts: `${v.date}T${v.time || '00:00'}`, date: v.date, category: 'sugar', icon: '🩸', text: `${t('vitals_sugar')}: ${v.value}` }));
  weight.filter((v) => v.personId === personId).forEach((v) => events.push({ ts: `${v.date}T${v.time || '00:00'}`, date: v.date, category: 'weight', icon: '⚖️', text: `${t('vitals_weight')}: ${v.value} kg` }));
  other.filter((v) => v.personId === personId).forEach((v) => events.push({ ts: `${v.date}T${v.time || '00:00'}`, date: v.date, category: 'other', icon: '📈', text: `${t('other_' + v.type) || v.type}: ${v.value} ${v.unit || ''}` }));
  notes.filter((n) => n.personId === personId).forEach((n) => events.push({ ts: `${n.date}T00:00`, date: n.date, category: 'note', icon: '📝', text: `${t('note')}: ${n.title || n.content.slice(0, 40)}` }));
  vault.filter((v) => v.personId === personId).forEach((v) => events.push({ ts: `${v.date}T00:00`, date: v.date, category: 'vault', icon: '🗂️', text: `${t('vault_category_' + v.category)}: ${v.title}` }));
  activity.filter((a) => a.personId === personId).forEach((a) => events.push({ ts: `${a.date}T00:00`, date: a.date, category: 'activity', icon: '🚶', text: `${t('activity_walk')}: ${a.durationLabel || ''}` }));
  sleep.filter((s) => s.personId === personId).forEach((s) => events.push({ ts: `${s.date}T00:00`, date: s.date, category: 'sleep', icon: '😴', text: `${t('sleep_title')}: ${sleepDurationLabel(s.bedtime, s.wake)}` }));
  dq.filter((d) => d.personId === personId).forEach((d) => events.push({ ts: `${new Date(d.createdAt).toISOString().slice(0,10)}T00:00`, date: new Date(d.createdAt).toISOString().slice(0,10), category: 'doctor', icon: '❓', text: `${t('dq_title')}: ${d.text.slice(0, 40)}` }));

  events.sort((a, b) => b.ts.localeCompare(a.ts));
  return limit ? events.slice(0, limit) : events;
}

function timelineItemHTML(ev) {
  return `<li class="timeline-item">
    <span class="timeline-item__icon">${ev.icon}</span>
    <span class="timeline-item__body"><strong>${U.escapeHTML(ev.text)}</strong><small>${ev.date}</small></span>
  </li>`;
}

async function renderTimeline() {
  topbarTitle.textContent = t('timeline_title');
  const person = currentPerson();
  const events = await buildTimelineEvents(person.id);
  const categories = ['all', 'medicine', 'bp', 'sugar', 'weight', 'other', 'note', 'vault', 'activity', 'sleep', 'doctor'];
  const catLabelKey = { medicine: 'nav_medicines', bp: 'vitals_bp', sugar: 'vitals_sugar', weight: 'vitals_weight', other: 'vitals_other', note: 'nav_notes', vault: 'nav_vault', activity: 'activity_title', sleep: 'sleep_title', doctor: 'dq_title' };

  app.innerHTML = `
    <div class="view-header"><h1>${t('timeline_title')}</h1></div>
    <div class="filter-row" id="timeline-filters">
      ${categories.map((c) => `<button class="filter-chip ${c === 'all' ? 'filter-chip--active' : ''}" data-cat="${c}">${c === 'all' ? t('timeline_filter_all') : t(catLabelKey[c])}</button>`).join('')}
    </div>
    <div id="timeline-content">
      ${events.length ? `<ul class="timeline-list">${events.map(timelineItemHTML).join('')}</ul>` : `<p class="muted">${t('timeline_empty')}</p>`}
    </div>
  `;

  document.getElementById('timeline-filters').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-chip');
    if (!btn) return;
    document.querySelectorAll('.filter-chip').forEach((c) => c.classList.remove('filter-chip--active'));
    btn.classList.add('filter-chip--active');
    const cat = btn.dataset.cat;
    const filtered = cat === 'all' ? events : events.filter((ev) => ev.category === cat);
    document.getElementById('timeline-content').innerHTML = filtered.length
      ? `<ul class="timeline-list">${filtered.map(timelineItemHTML).join('')}</ul>`
      : `<p class="muted">${t('timeline_empty')}</p>`;
  });
}

// ---------------------------------------------------------------------------
// Calendar
// ---------------------------------------------------------------------------
async function renderCalendar(hash) {
  topbarTitle.textContent = t('calendar_title');
  const person = currentPerson();
  const params = new URLSearchParams((hash.split('?')[1] || ''));
  const now = new Date();
  const viewYear = Number(params.get('y')) || now.getFullYear();
  const viewMonth = Number(params.get('m')) || (now.getMonth() + 1);

  const events = await buildTimelineEvents(person.id);
  const eventsByDate = {};
  events.forEach((ev) => { (eventsByDate[ev.date] = eventsByDate[ev.date] || []).push(ev); });

  const firstOfMonth = new Date(viewYear, viewMonth - 1, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const monthNames = STRINGS[getLang()].month_names;
  const weekdayShort = STRINGS[getLang()].weekday_short;

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell cal-cell--empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${viewYear}-${U.pad2(viewMonth)}-${U.pad2(d)}`;
    const hasEvents = eventsByDate[iso];
    const isToday = iso === U.todayISO();
    cells += `<button class="cal-cell ${isToday ? 'cal-cell--today' : ''}" data-date="${iso}">
      <span>${d}</span>${hasEvents ? `<span class="cal-dot"></span>` : ''}
    </button>`;
  }

  const prevParams = viewMonth === 1 ? `y=${viewYear - 1}&m=12` : `y=${viewYear}&m=${viewMonth - 1}`;
  const nextParams = viewMonth === 12 ? `y=${viewYear + 1}&m=1` : `y=${viewYear}&m=${viewMonth + 1}`;

async function generateReport() {
  const personId = document.getElementById('rp-person').value;
  const month = Number(document.getElementById('rp-month').value);
  const year = Number(document.getElementById('rp-year').value);
  const person = state.persons.find((p) => p.id === personId);
  const startISO = `${year}-${U.pad2(month)}-01`;
  const endISO = `${year}-${U.pad2(month)}-${U.pad2(new Date(year, month, 0).getDate())}`;
  const inRange = (d) => d >= startISO && d <= endISO;

  const [meds, doseLogs, bp, sugar, weight, other, notes, vault] = await Promise.all([
    DB.getAll('medicines'), DB.getAll('doseLogs'), DB.getAll('vitalsBP'), DB.getAll('vitalsSugar'),
    DB.getAll('vitalsWeight'), DB.getAll('vitalsOther'), DB.getAll('notes'), DB.getAll('vault')
  ]);
  const medMap = Object.fromEntries(meds.map((m) => [m.id, m]));
  const myLogs = doseLogs.filter((l) => l.personId === personId && inRange(l.date));
  const taken = myLogs.filter((l) => l.status === 'taken').length;
  const missed = myLogs.filter((l) => l.status === 'missed').length;
  const myBP = bp.filter((v) => v.personId === personId && inRange(v.date));
  const mySugar = sugar.filter((v) => v.personId === personId && inRange(v.date));
  const myWeight = weight.filter((v) => v.personId === personId && inRange(v.date)).sort((a, b) => a.date.localeCompare(b.date));
  const myOther = other.filter((v) => v.personId === personId && inRange(v.date));
  const myNotes = notes.filter((n) => n.personId === personId && inRange(n.date));
  const myVault = vault.filter((v) => v.personId === personId && inRange(v.date));
  const myMeds = meds.filter((m) => m.personId === personId);

  const monthLabel = `${STRINGS[getLang()].month_names[month - 1]} ${year}`;

  const section = (titleKey, bodyHTML) => `<div class="report-block"><h3>${t(titleKey)}</h3>${bodyHTML}</div>`;
  const noData = `<p class="muted">${t('reports_no_data')}</p>`;

  const html = `
    <div class="report-sheet glass" id="report-sheet">
      <div class="report-sheet__header">
        <div>
          <strong class="report-sheet__brand">${t('appName')}</strong>
          <span>${t('tagline')}</span>
        </div>
        <div class="report-sheet__meta">
          <span>${U.escapeHTML(person?.name || '')}</span>
          <span>${monthLabel}</span>
        </div>
      </div>

      ${section('med_title', myMeds.length ? `
        <p>${taken} ${t('dose_taken').toLowerCase()} · ${missed} ${t('dose_missed').toLowerCase()} (${myLogs.length} ${t('common_all').toLowerCase()})</p>
        <ul class="report-list">${myMeds.map((m) => `<li>${U.escapeHTML(m.name)} — ${U.escapeHTML(m.dosage || '')} ${U.escapeHTML(m.unit || '')}</li>`).join('')}</ul>` : noData)}

      ${section('vitals_bp', myBP.length ? `<p>${t('bp_average')}: ${Math.round(U.average(myBP.map((v) => Number(v.systolic))))}/${Math.round(U.average(myBP.map((v) => Number(v.diastolic))))} mmHg (${myBP.length} ${t('common_all').toLowerCase()})</p>` : noData)}

      ${section('vitals_sugar', mySugar.length ? `<p>${t('bp_average')}: ${Math.round(U.average(mySugar.map((v) => Number(v.value))))} mg/dL (${mySugar.length} ${t('common_all').toLowerCase()})</p>` : noData)}

      ${section('vitals_weight', myWeight.length ? `<p>${t('weight_current')}: ${myWeight[myWeight.length - 1].value} kg — ${t('weight_change')}: ${U.round1(Number(myWeight[myWeight.length - 1].value) - Number(myWeight[0].value))} kg</p>` : noData)}

      ${section('vitals_other', myOther.length ? `<ul class="report-list">${myOther.slice(0, 10).map((v) => `<li>${v.date}: ${t('other_' + v.type) || v.type} — ${v.value} ${v.unit || ''}</li>`).join('')}</ul>` : noData)}

      ${section('notes_title', myNotes.length ? `<ul class="report-list">${myNotes.map((n) => `<li>${n.date}: ${U.escapeHTML(n.title || n.content.slice(0, 60))}</li>`).join('')}</ul>` : noData)}

      ${section('vault_title', myVault.length ? `<ul class="report-list">${myVault.map((v) => `<li>${v.date}: ${U.escapeHTML(v.title)} (${t('vault_category_' + v.category)})</li>`).join('')}</ul>` : noData)}

      <p class="report-sheet__disclaimer">${t('insights_disclaimer')}</p>
    </div>
    <div class="report-actions">
      <button class="btn btn--soft" id="toggle-doctor-mode">${t('reports_doctor_mode')}</button>
      <button class="btn btn--primary" id="print-report">🖨️ ${t('reports_print')}</button>
    </div>
  `;
  document.getElementById('report-output').innerHTML = html;
  document.getElementById('print-report').addEventListener('click', () => window.print());
  document.getElementById('toggle-doctor-mode').addEventListener('click', () => {
    document.getElementById('report-sheet').classList.toggle('report-sheet--doctor');
  });
}
